<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}

.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}

.wordmark{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.codot{width:10px;height:10px;border-radius:3px;background:var(--acc);display:inline-block}
.scopes{display:flex;gap:6px}
.scopes button{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;color:var(--muted)}
.scopes button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}

main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
h2.sec{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:17px;font-weight:600;margin:22px 0 10px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.tile .v.neg{color:var(--neg)}
.duo{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chartwrap{overflow-x:auto}
.legend{display:flex;gap:14px;margin:2px 0 8px;font-size:12px;color:var(--muted)}

Entity: Wahj (Jordan). Two brands in one company: Vyltic (padel events, matchmaking, venue SaaS) and Welltold ("Wiltord") (marketing agency). Currency JOD, 2 decimals. One bank pool; every line carries "co": "Vyltic" or "Welltold".

/* ---------- crypto / auth (email + password; keys unwrapped client-side) ---------- */
let ME=null, ADMIN=null, MYEMAIL="";
const SUPER="ahmad@vyltic.com";
async function deriveKek(pw,salt,usages){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:META.iter,hash:"SHA-256"},km,256);
  return new Uint8Array(bits);
}
const kekKey=async raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
async function unwrapAll(u,kekRaw){
  const k=await kekKey(kekRaw); const raw={};
  for(const [s,w] of Object.entries(u.keys||{})){
    try{ raw[s]=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(w.iv)},k,b64d(w.ct))); }catch(e){ return null; }
  }
  return raw;
}
async function installKeys(rawMap){
  KEYS={}; RAW={};
  for(const [s,b] of Object.entries(rawMap)){ RAW[s]=b; if(s!=="admin") KEYS[s]=await crypto.subtle.importKey("raw",b,{name:"AES-GCM"},false,["decrypt"]); }
}
async function loadScope(s){
  if(DATA[s]||!KEYS[s]) return;
  const get=async v=>{const buf=await (await fetch("data/"+s+".enc?v="+encodeURIComponent(v))).arrayBuffer();
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(META.scopes[s].iv)},KEYS[s],buf);
    DATA[s]=JSON.parse(new TextDecoder().decode(pt));};
  try{ await get(META.updated||"0"); }
  catch(e){ await get(Date.now()); }
}
const isAdmin=()=>!!RAW.admin;
const myScopes=()=>Object.keys(KEYS);

/* ---------- boot ---------- */
async function boot(){
  const m=document.getElementById("main");
  try{ META=await (await fetch("data/meta.json?t="+Date.now())).json(); }
  catch(e){ m.innerHTML='<div class="authbox"><h1><span class="codot"></span>Wahj Books</h1><p>Couldn’t load the data files. Check your connection and refresh.</p></div>'; return; }
  let sess=null; try{ sess=JSON.parse(sessionStorage.getItem("wahj.sess")||"null"); }catch(e){}
  if(sess&&sess.email&&sess.kek){
    const u=await findUser(sess.email);
    if(u){ const raw=await unwrapAll(u,b64d(sess.kek)); if(raw){ MYEMAIL=sess.email; await installKeys(raw); WHO=sess.name||sess.email; return enter(); } }
    try{ sessionStorage.removeItem("wahj.sess"); }catch(e){}
  }
  renderAuth(m);
}
async function findUser(email){ const eh=await sha256hex(email.trim().toLowerCase()); return (META.users||[]).find(u=>u.ehash===eh)||null; }
function renderAuth(m){
  document.getElementById("hdr").hidden=true;
  m.innerHTML="";
  const b=el("div","authbox");
  b.innerHTML='<h1><span class="codot"></span>Wahj Books</h1><p>Sign in to the company books.</p>';
  const f=el("form");
  const inp=el("input"); inp.type="email"; inp.placeholder="Email"; inp.autocomplete="username"; inp.required=true;
  const pw=el("input"); pw.type="password"; pw.placeholder="Password"; pw.autocomplete="current-password"; pw.required=true;
  const go=el("button","btn","Sign in"); go.type="submit";
  const err=el("div","err","");
  f.append(inp,pw,go,err);
  f.onsubmit=async ev=>{ ev.preventDefault(); go.disabled=true; go.textContent="Signing in…"; err.textContent="";
    const email=inp.value.trim().toLowerCase();
    const u=await findUser(email);
    let raw=null, kek=null;
    if(u){ kek=await deriveKek(pw.value,b64d(u.salt)); raw=await unwrapAll(u,kek); }
    if(!raw||!Object.keys(raw).length){ err.textContent="Wrong email or password, or this email has no access."; go.disabled=false; go.textContent="Sign in"; return; }
    MYEMAIL=email; await installKeys(raw); WHO=email;
    try{ sessionStorage.setItem("wahj.sess",JSON.stringify({email,kek:b64e(kek)})); }catch(e){}
    if(isAdmin()){ try{ await loadAdmin(); const me=ADMIN.people.find(p=>p.email===email); if(me&&me.name) WHO=me.name; }catch(e){} }
    enter();
  };
  b.appendChild(f);
  b.appendChild(el("p","meta","Forgot your password? Ask Ahmed (or any admin) to reset it."));
  m.appendChild(b);
}
async function enter(){
  if(!myScopes().includes(scope)) scope=myScopes().sort((a,b)=>ord[b]-ord[a])[0];
  document.getElementById("hdr").hidden=false;
  document.getElementById("main").innerHTML='<div class="skel"></div>';
  await loadScope(scope);
  renderScopes(); renderTabs(); render();
}

/* ---------- report engine ---------- */
function allLines(){ const out=[]; entriesArr().forEach(({e})=>e.lines.forEach(l=>out.push({e,l}))); return out; }
function months(){ return [...new Set(entriesArr().map(({e})=>(e.date||"").slice(0,7)))].sort(); }
function monthEnd(k){ const y=+k.slice(0,4), m=+k.slice(5,7); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); }
function mlabel(k){ return new Date(k+"-15T00:00:00Z").toLocaleString("en",{month:"short",timeZone:"UTC"})+" "+k.slice(0,4); }
function aggregate(from,to){
  const byCode={},byParty={};
  allLines().forEach(({e,l})=>{ if(from&&e.date<from) return; if(to&&e.date>to) return;
    const v=(+l.dr)-(+l.cr); byCode[l.code]=(byCode[l.code]||0)+v;
    const bp=byParty[l.code]=byParty[l.code]||{}; const p=l.party||"(unassigned)"; bp[p]=(bp[p]||0)+v; });
  return {byCode,byParty};
}
function periodCols(st){
  if(st.view==="total") return [{label:"Total",from:st.from,to:st.to}];
  const ms=months().filter(k=>k>=st.from.slice(0,7)&&k<=st.to.slice(0,7));
  return ms.map(k=>({label:mlabel(k),from:st.view==="cumulative"?st.from:(k+"-01"),to:monthEnd(k)<st.to?monthEnd(k):st.to}));
}
const nz=a=>a.some(v=>Math.abs(v)>=0.005);
const addv=(a,b)=>a.map((v,i)=>v+b[i]);
const subv=(a,b)=>a.map((v,i)=>v-b[i]);
function optRow(m,st,onchange,views){
  const f=el("div","filters");
  if(st.level!==undefined){
    f.appendChild(el("span","flbl","Level:"));
    const s=el("select"); s.innerHTML='<option value="1">1 — sections</option><option value="3">3 — accounts</option><option value="10">10 — accounts + parties</option>';
    s.value=String(st.level); s.onchange=()=>onchange({level:+s.value}); f.appendChild(s);
  }
  if(views){
    f.appendChild(el("span","flbl","View:"));
    const s=el("select"); s.innerHTML=views.map(v=>'<option value="'+v[0]+'">'+v[1]+'</option>').join("");
    s.value=st.view; s.onchange=()=>onchange({view:s.value}); f.appendChild(s);
  }
  if(st.from!==undefined){
    f.appendChild(el("span","flbl","From:")); const a=el("input"); a.type="date"; a.value=st.from; a.onchange=()=>onchange({from:a.value}); f.appendChild(a);
    f.appendChild(el("span","flbl","to:")); const b=el("input"); b.type="date"; b.value=st.to; b.onchange=()=>onchange({to:b.value}); f.appendChild(b);
  }
  if(st.asOf!==undefined){
    f.appendChild(el("span","flbl","As at:")); const a=el("input"); a.type="date"; a.value=st.asOf; a.onchange=()=>onchange({asOf:a.value}); f.appendChild(a);
  }
  f.appendChild(el("span","meta","Company: "+scopeLabel[scope]));
  m.appendChild(f);
}
function xlGrid(rows,cols){
  const multi=cols.length>1;
  const w=el("div","tablewrap xlwrap");
  const t=el("table","xl");
  const hr=el("tr","hdr"); hr.appendChild(el("th","","Line"));
  if(multi) cols.forEach(c=>hr.appendChild(el("th","a",esc(c.label))));
  else { hr.appendChild(el("th","a","Total")); hr.appendChild(el("th","a","Detail")); }
  t.appendChild(hr);
  rows.forEach(r=>{
    const tr=el("tr",r.cls||"");
    const td=el("td",r.ind?("i"+r.ind):""); td.textContent=r.label; tr.appendChild(td);
    if(multi){ r.vals.forEach(v=>{ const c=el("td","a"); c.textContent=Math.abs(v)>=0.005?fmt(v):"·"; tr.appendChild(c); }); }
    else { const sec=(r.cls==="l0"||r.cls==="grand");
      const a1=el("td","a"); a1.textContent=sec?fmt(r.vals[0]):""; tr.appendChild(a1);
      const a2=el("td","a"); a2.textContent=sec?"":fmt(r.vals[0]); tr.appendChild(a2); }
    t.appendChild(tr);
  });
  w.appendChild(t); return w;
}
const REVC=COA.filter(a=>a[2]==="Revenue").map(a=>a[0]), COSC=COA.filter(a=>a[4]==="Cost of Sales").map(a=>a[0]), OPXC=COA.filter(a=>a[4]==="Operating Expenses").map(a=>a[0]);
function plGrid(level,cols){
  const aggs=cols.map(c=>aggregate(c.from,c.to));
  const sign=c=>ACC[c].type==="Revenue"?-1:1;
  const section=(codes)=>{ let tot=cols.map(()=>0); const body=[];
    codes.forEach(c=>{ const vals=aggs.map(a=>(a.byCode[c]||0)*sign(c)); if(!nz(vals)) return; tot=addv(tot,vals);
      if(level>=3){ body.push({label:ACC[c].name,ind:1,cls:"l1",vals});
        if(level>=10){ const ps=new Set(); aggs.forEach(a=>Object.keys(a.byParty[c]||{}).forEach(p=>ps.add(p)));
          [...ps].sort().forEach(p=>{ const pv=aggs.map(a=>((a.byParty[c]||{})[p]||0)*sign(c)); if(nz(pv)) body.push({label:p,ind:2,vals:pv}); }); } } });
    return {tot,body}; };
  const R=section(REVC),C=section(COSC),O=section(OPXC);
  return [{label:"REVENUE",cls:"l0",vals:R.tot},...R.body,
          {label:"COST OF SALES",cls:"l0",vals:C.tot},...C.body,
          {label:"GROSS PROFIT",cls:"l0",vals:subv(R.tot,C.tot)},
          {label:"OPERATING EXPENSES",cls:"l0",vals:O.tot},...O.body,
          {label:"NET INCOME",cls:"grand",vals:subv(subv(R.tot,C.tot),O.tot)}];
}
const PLVIEWS=[["total","Total — one column"],["monthly","By month"],["cumulative","By month, cumulative (YTD)"]];
function viewPL(m){
  const st=viewPL.st=viewPL.st||{level:3,view:"total",from:"2024-01-01",to:new Date().toISOString().slice(0,10)};
  const cols=periodCols(st);
  m.appendChild(el("div","xlhead","PROFIT & LOSS — "+st.from+" to "+st.to+"   Level "+st.level+"   ·   "+scopeLabel[scope]+(st.view==="cumulative"?"   ·   cumulative from "+st.from:st.view==="monthly"?"   ·   month by month":"")));
  optRow(m,st,ch=>{Object.assign(st,ch);render();},PLVIEWS);
  m.appendChild(xlGrid(plGrid(st.level,cols),cols));
}
function bsGrid(level,cols){
  const aggs=cols.map(c=>aggregate(null,c.asOf));
  const g=n=>COA.filter(a=>a[4]===n&&a[0]!=="IC").map(a=>a[0]);
  const rows=[];
  const group=(title,codes,sign,ind)=>{ let tot=cols.map(()=>0); const body=[];
    codes.forEach(c=>{ const vals=aggs.map(a=>(a.byCode[c]||0)*sign); if(!nz(vals)) return; tot=addv(tot,vals);
      if(level>=3){ body.push({label:ACC[c].name,ind:ind+1,cls:"l1",vals});
        if(level>=10){ const ps=new Set(); aggs.forEach(a=>Object.keys(a.byParty[c]||{}).forEach(p=>ps.add(p)));
          [...ps].sort().forEach(p=>{ const pv=aggs.map(a=>((a.byParty[c]||{})[p]||0)*sign); if(nz(pv)) body.push({label:p,ind:ind+2,vals:pv}); }); } } });
    return {title,tot,body,ind}; };
  const ca=group("Current Assets",g("Current Assets"),1,1), fa=group("Fixed Assets",g("Fixed Assets"),1,1), ia=group("Intangible Assets",g("Intangible Assets"),1,1);
  const ic=aggs.map(a=>a.byCode["IC"]||0);
  const cl=group("Current Liabilities",g("Current Liabilities"),-1,2), ll=group("Long-term Liabilities",g("Long-term Liabilities"),-1,2);
  const ni=aggs.map(a=>{ let v=0; [...REVC,...COSC,...OPXC].forEach(c=>v-=(a.byCode[c]||0)); return v; });
  const sc=aggs.map(a=>-(a.byCode["3000"]||0)), re=aggs.map(a=>-(a.byCode["3100"]||0)), dw=aggs.map(a=>-(a.byCode["3300"]||0));
  let assets=addv(addv(ca.tot,fa.tot),ia.tot); if(scope!=="consolidated") assets=addv(assets,ic);
  const liab=addv(cl.tot,ll.tot), eq=addv(addv(addv(sc,re),dw),ni);
  rows.push({label:"ASSETS",cls:"l0",vals:assets});
  [ca,fa,ia].forEach(gr=>{ if(!nz(gr.tot)&&!gr.body.length) return; rows.push({label:gr.title,ind:1,cls:"l1",vals:gr.tot}); rows.push(...gr.body); });
  if(scope!=="consolidated"&&nz(ic)) rows.push({label:"Intercompany ("+(scope==="vyltic"?"Welltold":"Vyltic")+")",ind:1,cls:"l1",vals:ic});
  rows.push({label:"LIABILITIES & OWNERS EQUITY",cls:"l0",vals:addv(liab,eq)});
  rows.push({label:"Liabilities",ind:1,cls:"l1",vals:liab});
  [cl,ll].forEach(gr=>{ if(!nz(gr.tot)&&!gr.body.length) return; rows.push({label:gr.title,ind:2,cls:"l1",vals:gr.tot}); rows.push(...gr.body); });
  rows.push({label:"Owners Equity",ind:1,cls:"l1",vals:eq});
  if(level>=3){
    rows.push({label:"Share Capital",ind:2,cls:"l1",vals:sc});
    if(level>=10){ const ps=new Set(); aggs.forEach(a=>Object.keys(a.byParty["3000"]||{}).forEach(p=>ps.add(p)));
      [...ps].sort().forEach(p=>{ const pv=aggs.map(a=>-((a.byParty["3000"]||{})[p]||0)); if(nz(pv)) rows.push({label:p,ind:3,vals:pv}); }); }
    if(nz(re)) rows.push({label:"Retained Earnings",ind:2,cls:"l1",vals:re});
    if(nz(dw)) rows.push({label:"Owner's Draws & Buybacks",ind:2,cls:"l1",vals:dw});
    rows.push({label:"Net income (current period)",ind:2,cls:"l1",vals:ni});
  }
  rows.push({label:"BALANCE CHECK (Assets − Liab & Equity)",cls:"grand",vals:subv(subv(assets,liab),eq)});
  return rows;
}
const BSVIEWS=[["asat","As at date — one column"],["monthend","Month-end balances, by month"]];

function cfGrid(level,cols){
  const aggs=cols.map(c=>aggregate(c.from,c.to));
  const classes=[["Operating activities","Operating"],["Investing activities","Investing"],["Financing activities","Financing"]];
  const rows=[]; let net=cols.map(()=>0);
  classes.forEach(([title,cf])=>{ const codes=COA.filter(a=>a[5]===cf).map(a=>a[0]); let tot=cols.map(()=>0); const body=[];
    codes.forEach(c=>{ const vals=aggs.map(a=>-(a.byCode[c]||0)); if(!nz(vals)) return; tot=addv(tot,vals);
      if(level>=3){ body.push({label:ACC[c].name,ind:1,cls:"l1",vals});
        if(level>=10){ const ps=new Set(); aggs.forEach(a=>Object.keys(a.byParty[c]||{}).forEach(p=>ps.add(p)));
          [...ps].sort().forEach(p=>{ const pv=aggs.map(a=>-((a.byParty[c]||{})[p]||0)); if(nz(pv)) body.push({label:p,ind:2,vals:pv}); }); } } });
    net=addv(net,tot); rows.push({label:title,cls:"l0",vals:tot},...body); });
  rows.push({label:"NET CHANGE IN CASH",cls:"grand",vals:net});
  const cashC=COA.filter(a=>a[5]==="Cash").map(a=>a[0]);
  const beg=cols.map(c=>{ let v=0; allLines().forEach(({e,l})=>{ if(e.date>=c.from) return; if(cashC.includes(l.code)) v+=(+l.dr)-(+l.cr); }); return v; });
  rows.push({label:"Cash at start of period",ind:1,vals:beg});
  rows.push({label:"Cash at end of period",ind:1,cls:"l1",vals:addv(beg,net)});
  return rows;
}

function viewTB(m){

  h+='<tr style="font-weight:700"><td></td><td>TOTAL</td><td class="num">'+fmt(TB)+'</td><td class="num">'+fmt(TD)+'</td><td class="num">'+fmt(TC)+'</td><td class="num">'+fmt(TE)+'</td></tr>';
  w.innerHTML=h+'</tbody></table>'; m.appendChild(w);
  m.appendChild(el("p","meta","Ending total is 0.00 when the ledger balances"+(scope!=="consolidated"?" (single-company views balance through the IC Intercompany line).":".")));
}
function viewGL(m){
  const f=el("div","filters");
  const selM=el("select"); selM.innerHTML='<option value="">All months</option>'+months().slice().reverse().map(x=>'<option>'+x+'</option>').join("");
  const selA=el("select"); selA.innerHTML='<option value="">All accounts</option>'+COA.map(a=>'<option value="'+a[0]+'">'+a[0]+" · "+esc(a[1])+'</option>').join("");
  const q=el("input"); q.placeholder="Search text / party / #"; q.style.flex="1"; q.style.minWidth="140px";
  const exp=el("button","btn2","Export CSV");
  f.append(selM,selA,q,exp); m.appendChild(f);
  const w=el("div","tablewrap xlwrap"); m.appendChild(w);
  const cnt=el("p","meta",""); m.appendChild(cnt);
  const rows=()=>{
    const mv=selM.value,av=selA.value,qv=q.value.trim().toLowerCase(); const out=[];
    entriesArr().forEach(({e})=>e.lines.forEach(l=>{
      if(mv&&(e.date||"").slice(0,7)!==mv) return;
      if(av&&l.code!==av) return;
      if(qv&&!((e.n+" "+(l.party||"")+" "+(l.desc||"")).toLowerCase().includes(qv))) return;
      out.push({e,l}); }));
    return out.sort((a,b)=>a.e.date<b.e.date?1:a.e.date>b.e.date?-1:b.e.n-a.e.n);
  };
  const draw=()=>{
    const list=rows();

function chart6(){
  const wrap=el("div","chartwrap");
  const per={};
  entriesArr().forEach(({e})=>e.lines.forEach(l=>{ const k=(e.date||"").slice(0,7); if(!k) return;
    per[k]=per[k]||{Vyltic:0,Welltold:0};
    if(l.code[0]==="4") per[k][l.co]=(per[k][l.co]||0)+(+l.cr)-(+l.dr);
    else if(l.code[0]==="5") per[k][l.co]=(per[k][l.co]||0)-((+l.dr)-(+l.cr)); }));
  const keys=Object.keys(per).sort().slice(-6);
  if(!keys.length){ wrap.textContent="No data yet."; return wrap; }
  const series=scope==="consolidated"?["Vyltic","Welltold"]:scope==="welltold"?["Welltold"]:["Vyltic"];
  if(series.length>1) wrap.appendChild(el("div","legend",'<span><i style="background:var(--vy)"></i>Vyltic</span><span><i style="background:var(--we)"></i>Welltold</span>'));
  const vals=[]; keys.forEach(k=>series.forEach(s=>vals.push(per[k][s]||0)));
  const max=Math.max(1,...vals.map(Math.abs));
  const W=460,H=170,P=28,zero=H-34-((H-52)*0.5);
  const bw=series.length>1?16:26, gw=(W-P-8)/keys.length;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly net">';
  s+='<line x1="'+P+'" y1="'+zero+'" x2="'+(W-4)+'" y2="'+zero+'" stroke="var(--line2)" stroke-width="1"/>';
  keys.forEach((k,i)=>{ series.forEach((sr,j)=>{ const v=per[k][sr]||0,h=Math.abs(v)/max*(H-52)/2;
      const x=P+8+i*gw+j*(bw+2)+(gw-series.length*(bw+2))/2, y=v>=0?zero-h:zero;
      const col=v<0?"var(--neg)":(series.length>1?(sr==="Vyltic"?"var(--vy)":"var(--we)"):(scope==="welltold"?"var(--we)":"var(--vy)"));
      s+='<rect data-t="'+esc(sr+" "+k+": "+fmt(v))+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="3" fill="'+col+'"/>'; });
    s+='<text x="'+(P+8+i*gw+gw/2-1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle">'+k.slice(2).replace("-","/")+'</text>'; });
  s+='<text x="'+(P-4)+'" y="'+(zero+3)+'" font-size="10" text-anchor="end">0</text></svg>';
  wrap.innerHTML+=s;
  wrap.addEventListener("mousemove",ev=>{ const r=ev.target.closest("rect[data-t]"); let t=document.querySelector(".ttip");
    if(!r){ if(t)t.remove(); return; } if(!t){ t=el("div","ttip"); document.body.appendChild(t); }
    t.textContent=r.getAttribute("data-t"); t.style.left=(ev.clientX+12)+"px"; t.style.top=(ev.clientY-10)+"px"; });
  wrap.addEventListener("mouseleave",()=>{const t=document.querySelector(".ttip");if(t)t.remove();});
  return wrap;
}

/* ---------- admin (people & permissions; saved straight to the site via GitHub) ---------- */
const GH={owner:"WahjBooks",repo:"wahjbooks.github.io"};
async function ghGetSha(path,pat){
  const r=await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+path+"?t="+Date.now(),{headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github+json"}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("GitHub read failed ("+r.status+")");
  return (await r.json()).sha;
}
async function ghPut(path,bytes,msg,pat){
  const sha=await ghGetSha(path,pat);
  const body={message:msg+"\n\nCo-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>",content:b64e(bytes)};
  if(sha) body.sha=sha;
  const r=await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("GitHub write failed ("+r.status+")");
}
async function loadAdmin(){
  if(ADMIN) return ADMIN;
  const k=await crypto.subtle.importKey("raw",RAW.admin,{name:"AES-GCM"},false,["decrypt","encrypt"]);
  const buf=await (await fetch("data/admin.enc?t="+Date.now())).arrayBuffer();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(META.admin.iv)},k,buf);
  ADMIN=JSON.parse(new TextDecoder().decode(pt));
  return ADMIN;
}
async function saveAdmin(msg){
  const users=[];
  for(const p of ADMIN.people){
    const k=await kekKey(b64d(p.kek)); const keys={};
    const want=[...p.scopes,...(p.admin?["admin"]:[])];
    for(const s of want){ if(!RAW[s]) throw new Error("You can’t grant "+s+" — you don’t hold it yourself.");
      const iv=crypto.getRandomValues(new Uint8Array(12));
      keys[s]={iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,RAW[s]))}; }
    users.push({ehash:await sha256hex(p.email),salt:p.salt,keys});
  }
  const meta2=JSON.parse(JSON.stringify(META)); meta2.users=users;
  const ak=await crypto.subtle.importKey("raw",RAW.admin,{name:"AES-GCM"},false,["encrypt"]);
  const aiv=crypto.getRandomValues(new Uint8Array(12));
  const aenc=await crypto.subtle.encrypt({name:"AES-GCM",iv:aiv},ak,new TextEncoder().encode(JSON.stringify(ADMIN)));
  meta2.admin={iv:b64e(aiv)};
  await ghPut("data/admin.enc",aenc,msg,ADMIN.pat);
  await ghPut("data/meta.json",new TextEncoder().encode(JSON.stringify(meta2,null,1)),msg,ADMIN.pat);
  META=meta2;
}

  +'<h3>How entries get in</h3><p>Send receipts and amounts to Ahmed as usual, or build a draft in the <strong>Record</strong> tab (your own AI can draft it — copy the briefing below into any AI chat). Ahmed&rsquo;s Claude posts it; the site updates for everyone within a minute.</p>'
  +'<h3>Reading the numbers</h3><p>Cash is one pooled bank balance for the whole entity — a company&rsquo;s share can be negative (the other side funds it). Lines marked <code>IC Intercompany</code> only balance cross-company entries inside a single-company view. The Welltold profit share (⅓ Joud + ⅓ Rami of the monthly net) is booked centrally at month-end.</p>'
  +'<h3>Briefing for your AI</h3>';
  const cp=el("button","btn2","Copy AI briefing"); cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(RULES).then(()=>toast("Copied."));};
  g.appendChild(cp);
  const pre=el("pre","brief"); pre.textContent=RULES; g.appendChild(pre);
  const out=el("button","btn3","Sign out of this device"); out.style.marginTop="16px"; out.onclick=signOut;
  g.appendChild(out);
  m.appendChild(g);
}

const totop=document.getElementById("totop");
function upd(){ const w=document.querySelector(".xlwrap"); const s=window.scrollY>500||(w&&w.scrollTop>400); totop.classList.toggle("show",!!s); }
window.addEventListener("scroll",upd,{passive:true});
document.addEventListener("scroll",e=>{ if(e.target&&e.target.classList&&e.target.classList.contains("xlwrap")) upd(); },true);
totop.onclick=()=>{ document.querySelectorAll(".xlwrap").forEach(w=>w.scrollTo({top:0,behavior:"smooth"})); window.scrollTo({top:0,behavior:"smooth"}); };
boot();
</script>
