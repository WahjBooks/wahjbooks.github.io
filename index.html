<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wahj Books</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F3F4F1; --ink:#1C2321; --muted:#5B6663; --faint:#8B948F;
  --line:#E4E7E3; --line2:#D5DAD4;
  --acc:#4B55C4; --acc-ink:#FFFFFF; --acc-soft:rgba(75,85,196,.12);
  --vy:#0A8A5C; --we:#C2620A;
  --neg:#B42318; --chip:#EEF0EC; --focus:#2C6BD8;
  --shadow:0 1px 2px rgba(20,24,22,.06),0 4px 14px rgba(20,24,22,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --surface:#1B1F1D; --surface2:#222724; --ink:#ECEFED; --muted:#9AA5A0; --faint:#6E7873;
    --line:#2A302D; --line2:#39413D;
    --acc:#8B93E8; --acc-ink:#10211C; --acc-soft:rgba(139,147,232,.18);
    --vy:#1E9E8A; --we:#CE7B1F;
    --neg:#E8695A; --chip:#262C29; --focus:#7FA7EE;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1B1F1D; --surface2:#222724; --ink:#ECEFED; --muted:#9AA5A0; --faint:#6E7873;
  --line:#2A302D; --line2:#39413D;
  --acc:#8B93E8; --acc-ink:#10211C; --acc-soft:rgba(139,147,232,.18);
  --vy:#1E9E8A; --we:#CE7B1F;
  --neg:#E8695A; --chip:#262C29; --focus:#7FA7EE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wordmark{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.codot{width:10px;height:10px;border-radius:3px;background:var(--acc);display:inline-block}
.scopes{display:flex;gap:6px}
.scopes button{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;color:var(--muted)}
.scopes button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{padding:7px 13px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2.sec{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:17px;font-weight:600;margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.tile .v.neg{color:var(--neg)}
.duo{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
@media(max-width:760px){.duo{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chartwrap{overflow-x:auto}
.legend{display:flex;gap:14px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.recents{display:flex;flex-direction:column}
.recent{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.recent:last-child{border-bottom:0}
.recent .d{color:var(--faint);font-size:12px;flex:none;width:44px}
.recent .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .a{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.filters input,.filters select{padding:6px 9px;font-size:13px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.gl{border-collapse:collapse;width:100%;min-width:620px}
table.gl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface)}
table.gl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.gl tr.je{cursor:pointer}
table.gl tr.je:hover td{background:var(--surface2)}
table.gl .num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.lines td{background:var(--surface2);padding:4px 12px 10px}
.linetbl{width:100%;border-collapse:collapse;font-size:13px}
.linetbl td{border-bottom:1px dashed var(--line);padding:4px 8px;background:none}
.linetbl td:first-child{white-space:nowrap;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pill{font-size:11px;border-radius:99px;padding:1px 8px;background:none;white-space:nowrap;border:1px solid var(--line2);color:var(--muted)}
.pill.vy{color:var(--vy);border-color:var(--vy)}
.pill.we{color:var(--we);border-color:var(--we)}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:9px;padding:9px 16px}
.btn[disabled]{opacity:.55;cursor:default}
.btn2{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-weight:500}
.btn3{color:var(--acc);font-weight:600;padding:8px 10px;border-radius:8px}
.btn3:hover{background:var(--acc-soft)}
.danger{color:var(--neg)}
.submitcol{max-width:720px}
textarea.raw{width:100%;min-height:96px;resize:vertical}
.drafttbl{width:100%;border-collapse:collapse;margin-top:8px}
.drafttbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px}
.drafttbl td{padding:3px 4px}
.drafttbl input,.drafttbl select{width:100%;padding:5px 7px;font-size:13px;border-radius:7px}
.drafttbl .amt{width:92px}
.drafttbl .cd{width:150px}
.drafttbl .cosel{width:96px}
.balrow{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:13px}
.balrow .ok{color:var(--vy);font-weight:600}
.balrow .off{color:var(--neg);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.guide{max-width:760px}
.guide h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:15px;margin:20px 0 6px}
.guide p,.guide li{font-size:13.5px}
.guide code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--chip);border-radius:5px;padding:1px 5px}
pre.brief{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:pre-wrap;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:50;max-width:88vw}
.authbox{max-width:390px;margin:9vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.authbox h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:22px;margin:0 0 4px;display:flex;gap:9px;align-items:center}
.authbox p{color:var(--muted);font-size:13px;margin:4px 0 16px}
.authbox form{display:flex;flex-direction:column;gap:9px}
.authbox .err{color:var(--neg);font-size:13px;min-height:18px;margin:6px 0 0}
svg text{fill:var(--muted);font-family:"IBM Plex Sans",sans-serif}
.ttip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:7px;padding:5px 9px;z-index:60;white-space:nowrap}
.skel{height:80px;border-radius:12px;background:var(--surface2)}
</style>
</head>
<body>
<header class="app" id="hdr" hidden><div class="hrow">
  <span class="wordmark"><span class="codot"></span>Wahj Books</span>
  <span class="scopes" id="scopes"></span>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<main id="main"><div class="skel"></div></main>

<script>
"use strict";
const COA=[["1000","Cash"],["1010","Bank"],["1050","Bank Reconciliation"],["1100","Accounts Receivable"],["1200","Inventory"],["1300","Prepaid Expenses"],["1500","Property, Plant & Equipment"],["1600","Accumulated Depreciation"],["1710","App Development"],["2000","Accounts Payable"],["2100","Accrued Liabilities"],["2200","Taxes Payable"],["2500","Loans Payable"],["2510","Related-Party Payable"],["3000","Share Capital"],["3100","Retained Earnings"],["3300","Owner's Draws & Buybacks"],["4000","Revenue"],["4010","Court Rental"],["4020","Coaching / Academy"],["4030","Tournaments & Events"],["4040","Pro-shop / Merchandise"],["4050","Memberships"],["4060","Food & Beverage"],["4070","Sponsorship Revenue"],["4080","Venue Commissions"],["4090","SaaS Revenue - Venues"],["4100","Other Income"],["4110","Management Fee Income"],["4120","Consulting Income"],["4510","Retainer Fees"],["4520","Ad Management / Media Buying"],["4530","Content & Production"],["4540","Consulting / Strategy"],["4560","Event Revenue"],["5000","Cost of Sales"],["5010","Event Costs - Court Bookings"],["5020","Event Costs - Prize Pools"],["5030","Event Costs - Referees & Freelancers"],["5040","Event Costs - Revenue Sharing"],["5050","Event Costs - Other"],["5100","Salaries & Wages"],["5150","Freelancers"],["5200","Marketing"],["5210","Giveaways"],["5250","Software & Subscriptions"],["5300","Rent & Utilities"],["5310","Licenses & Government Fees"],["5320","Legal & Professional"],["5330","Travel & Transportation"],["5340","Office & General"],["5400","Depreciation"],["5500","Interest Expense"],["5900","Other Expenses"],["IC","Intercompany"]];
const RULES=`WAHJ BOOKS - BRIEFING FOR ANY AI ASSISTANT (drafting journal entries)

Entity: Wahj (Jordan). Two brands in one company: Vyltic (padel events, matchmaking, venue SaaS) and Welltold ("Wiltord") (marketing agency). Currency JOD, 2 decimals. One bank pool; every line carries "co": "Vyltic" or "Welltold".

Rules:
1. Double entry - total debits (dr) must equal total credits (cr).
2. Cash in/out (incl. company Visa card) -> code 1000 Cash. Cash OUT credits 1000; cash IN debits 1000.
3. Revenue billed but not collected -> Dr 1100 Accounts Receivable (party = client, add "[unpaid]" to desc). Collection later: Dr 1000 / Cr 1100 "clears #<entry>".
4. Welltold revenue: retainers -> 4510, projects/content/videos -> 4530. Vyltic revenue: tournaments -> 4030, venue commissions & matchmaking -> 4080, venue SaaS -> 4090, sponsorship -> 4070.
5. From Aug 2026 marketing invoices MAY carry 16% sales tax - only when the invoice shows it: revenue net to 4xxx, tax to Cr 2200 Taxes Payable.
6. Client withheld 5% withholding tax when paying: book revenue GROSS; the withheld 5% -> Dr 1300 Prepaid Expenses, party "Withholding Tax".
7. Salaries: mid-month payments to staff are advances -> Dr 1100 (party = person). Month-end salary expense Dr 5100 clears the advances (Cr 1100) or accrues Cr 2000 "[unpaid]".
8. Welltold delivery costs (freelancers, camera rental, client-work designers) -> 5150 or 5900. They reduce the monthly profit-share net.
9. PROFIT SHARE (Welltold): Joud 1/3 + Rami 1/3 of monthly NET (revenue - 5150/5900 - 5100 Welltold). NEVER draft it - booked centrally at month-end. Loss month = no share.
10. Small office/misc -> 5340. Recruiting/ads -> 5200. Software/domains/emails -> 5250. Rent/utilities/telecom -> 5300. Equipment -> 1500 (party = category, e.g. "IT & Computer Equipment", "Furniture & Fixtures"). App development -> 1710.
11. USD charges: JOD = USD x 0.738; add "true-up vs bank" to desc.
12. Use party names already in the books when they exist. A receipt's amount beats a remembered amount.
13. Never draft "IC Intercompany" lines and never invent account codes.

Output EXACTLY this JSON (the person sends it to Ahmed's Claude, or pastes it in the site's Record tab first to check it balances):
{"date":"YYYY-MM-DD","memo":"short memo","lines":[{"code":"1000","account":"Cash","party":"","desc":"","dr":0,"cr":0,"co":"Vyltic"}],"notes":"anything uncertain, else empty"}`;
const fmt=n=>(n<0?"−":"")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m,ms){const t=el("div","toast",esc(m));document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3800);}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

let META=null, KEYS={}, WHO="", DATA={};      // scope -> entries object {id:{n,date,serial,lines}}
let tab="Dashboard", scope="";
let draft=null;
try{ tab=localStorage.getItem("wahj.tab")||"Dashboard"; scope=localStorage.getItem("wahj.scope")||""; }catch(e){}

const myScopes=()=>Object.keys(KEYS);
const ord={vyltic:0,welltold:1,consolidated:2};
const scopeLabel={vyltic:"Vyltic",welltold:"Welltold",consolidated:"Consolidated"};
const entriesArr=()=>{ const d=DATA[scope]||{}; return Object.keys(d).sort().map(k=>({id:k,e:d[k]})); };

/* ============ crypto ============ */
async function deriveKek(code,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:META.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function tryCode(code){
  const found={}; let label="";
  for(const w of META.wraps){
    let kek;
    try{ kek=await deriveKek(code,b64d(w.salt)); }catch(e){ continue; }
    for(const [s,k] of Object.entries(w.keys)){
      try{
        const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(k.iv)},kek,b64d(k.ct));
        found[s]=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
        label=w.label;
      }catch(e){}
    }
    if(Object.keys(found).length) break;
  }
  return {keys:found,label};
}
async function loadScope(s){
  if(DATA[s]||!KEYS[s]) return;
  const buf=await (await fetch("data/"+s+".enc?v="+encodeURIComponent(META.updated||"0"))).arrayBuffer();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(META.scopes[s].iv)},KEYS[s],buf);
  DATA[s]=JSON.parse(new TextDecoder().decode(pt));
}

/* ============ boot ============ */
async function boot(){
  const m=document.getElementById("main");
  try{ META=await (await fetch("data/meta.json?t="+Date.now())).json(); }
  catch(e){ m.innerHTML='<div class="authbox"><h1><span class="codot"></span>Wahj Books</h1><p>Couldn’t load the data files. Check your connection and refresh.</p></div>'; return; }
  let saved=""; try{ saved=localStorage.getItem("wahj.code")||""; }catch(e){}
  if(saved){
    const r=await tryCode(saved);
    if(Object.keys(r.keys).length){ KEYS=r.keys; WHO=r.label; return enter(); }
  }
  renderAuth(m);
}
function renderAuth(m){
  document.getElementById("hdr").hidden=true;
  m.innerHTML="";
  const b=el("div","authbox");
  b.innerHTML='<h1><span class="codot"></span>Wahj Books</h1><p>Enter your access code. It decides what you can see — Vyltic, Welltold, or everything.</p>';
  const f=el("form");
  const inp=el("input"); inp.placeholder="e.g. xxxx-xxxx-xxxx"; inp.autocomplete="off"; inp.required=true; inp.className="mono";
  const go=el("button","btn","Open the books"); go.type="submit";
  const err=el("div","err","");
  f.append(inp,go,err);
  f.onsubmit=async ev=>{ ev.preventDefault(); go.disabled=true; go.textContent="Checking…"; err.textContent="";
    const code=inp.value.trim().toLowerCase();
    const r=await tryCode(code);
    if(!Object.keys(r.keys).length){ err.textContent="That code doesn’t open anything. Check it with Ahmed."; go.disabled=false; go.textContent="Open the books"; return; }
    KEYS=r.keys; WHO=r.label;
    try{ localStorage.setItem("wahj.code",code); }catch(e){}
    enter(); };
  b.appendChild(f); m.appendChild(b);
}
async function enter(){
  if(!myScopes().includes(scope)) scope=myScopes().sort((a,b)=>ord[b]-ord[a])[0];
  document.getElementById("hdr").hidden=false;
  document.getElementById("main").innerHTML='<div class="skel"></div>';
  await loadScope(scope);
  renderScopes(); renderTabs(); render();
}
function signOut(){ try{localStorage.removeItem("wahj.code");}catch(e){} location.reload(); }

/* ============ chrome ============ */
function renderScopes(){
  const n=document.getElementById("scopes"); n.innerHTML="";
  myScopes().sort((a,b)=>ord[a]-ord[b]).forEach(s=>{ const b=el("button","",scopeLabel[s]);
    b.setAttribute("aria-pressed",s===scope?"true":"false");
    b.onclick=async()=>{ scope=s; try{localStorage.setItem("wahj.scope",s);}catch(e){} await loadScope(s); renderScopes(); render(); };
    n.appendChild(b); });
}
function renderTabs(){
  const n=document.getElementById("tabs"); n.innerHTML="";
  ["Dashboard","Ledger","Record","Guide"].forEach(t=>{ const b=el("button","",t);
    b.setAttribute("role","tab"); b.setAttribute("aria-selected",t===tab?"true":"false");
    b.onclick=()=>{ tab=t; try{localStorage.setItem("wahj.tab",t);}catch(e){} renderTabs(); render(); };
    n.appendChild(b); });
}
function render(){
  const m=document.getElementById("main"); m.innerHTML="";
  ({Dashboard:viewDash,Ledger:viewLedger,Record:viewRecord,Guide:viewGuide})[tab](m);
}

/* ============ dashboard ============ */
function viewDash(m){
  const by={};
  entriesArr().forEach(({e})=>e.lines.forEach(l=>{ by[l.code]=(by[l.code]||0)+(+l.dr)-(+l.cr); }));
  const now=new Date().toISOString().slice(0,7);
  let rev=0,exp=0;
  entriesArr().forEach(({e})=>{ if((e.date||"").slice(0,7)!==now) return;
    e.lines.forEach(l=>{ if(l.code[0]==="4") rev+=(+l.cr)-(+l.dr); else if(l.code[0]==="5") exp+=(+l.dr)-(+l.cr); }); });
  const tiles=el("div","tiles");
  const tile=(a,v,s)=>tiles.appendChild(el("div","tile",'<div class="lbl">'+a+'</div><div class="v mono'+(v<0?" neg":"")+'">'+fmt(v)+'</div>'+(s?'<div class="s">'+s+'</div>':"")));
  tile(scope==="consolidated"?"Cash (entity)":"Cash — share",by["1000"]||0,scope==="consolidated"?"Etihad + Arab pooled":"bank pool is entity-wide");
  tile("Receivable",by["1100"]||0,"owed to us");
  tile("Payable",-(by["2000"]||0),"owed by us");
  tile("Net · "+now,rev-exp,fmt(rev)+" rev − "+fmt(exp)+" exp");
  if(scope!=="vyltic"){
    let wr=0,wd=0,wt=0;
    entriesArr().forEach(({e})=>{ if((e.date||"").slice(0,7)!==now) return;
      e.lines.forEach(l=>{ if((l.co||"")!=="Welltold") return;
        if(l.code[0]==="4") wr+=(+l.cr)-(+l.dr);
        if(l.code==="5150"||l.code==="5900") wd+=(+l.dr)-(+l.cr);
        if(l.code==="5100") wt+=(+l.dr)-(+l.cr); }); });
    const net=wr-wd-wt;
    tile("Welltold share basis · "+now,net,net>0?"⅓ each ≈ "+fmt(net/3)+" (booked at month-end)":"loss month — no share accrues");
  }
  m.appendChild(tiles);
  const duo=el("div","duo");
  const c1=el("div","card"); c1.appendChild(el("div","lbl","Monthly net — last 6 months")); c1.appendChild(chart6()); duo.appendChild(c1);
  const c2=el("div","card"); c2.appendChild(el("div","lbl","Latest entries"));
  const rec=el("div","recents");
  entriesArr().sort((a,b)=>a.e.date<b.e.date?1:a.e.date>b.e.date?-1:b.e.n-a.e.n).slice(0,9)
    .forEach(({e})=>rec.appendChild(el("div","recent",'<span class="d mono">'+esc((e.date||"").slice(5))+'</span><span class="t">'+esc((e.lines[0]||{}).desc||"")+'</span><span class="a">'+fmt(e.lines.reduce((a,l)=>a+(+l.dr),0))+'</span>')));
  c2.appendChild(rec); duo.appendChild(c2); m.appendChild(duo);
  if(scope==="vyltic") m.appendChild(el("p","meta","“Cash — share” can be negative: the bank accounts belong to the whole entity; the other side of the pool covers the difference."));
  m.appendChild(el("p","meta","Signed in with: "+esc(WHO)+" · books updated "+esc(META.updated||"")+"."));
}
function chart6(){
  const wrap=el("div","chartwrap");
  const per={};
  entriesArr().forEach(({e})=>e.lines.forEach(l=>{ const k=(e.date||"").slice(0,7); if(!k) return;
    per[k]=per[k]||{Vyltic:0,Welltold:0};
    if(l.code[0]==="4") per[k][l.co]= (per[k][l.co]||0) + (+l.cr)-(+l.dr);
    else if(l.code[0]==="5") per[k][l.co]=(per[k][l.co]||0) - ((+l.dr)-(+l.cr)); }));
  const keys=Object.keys(per).sort().slice(-6);
  if(!keys.length){ wrap.textContent="No data yet."; return wrap; }
  const series=scope==="consolidated"?["Vyltic","Welltold"]:scope==="welltold"?["Welltold"]:["Vyltic"];
  if(series.length>1) wrap.appendChild(el("div","legend",'<span><i style="background:var(--vy)"></i>Vyltic</span><span><i style="background:var(--we)"></i>Welltold</span>'));
  const vals=[]; keys.forEach(k=>series.forEach(s=>vals.push(per[k][s]||0)));
  const max=Math.max(1,...vals.map(Math.abs));
  const W=460,H=170,P=28,zero=H-34-((H-52)*0.5);
  const bw=series.length>1?16:26, gw=(W-P-8)/keys.length;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly net">';
  s+='<line x1="'+P+'" y1="'+zero+'" x2="'+(W-4)+'" y2="'+zero+'" stroke="var(--line2)" stroke-width="1"/>';
  keys.forEach((k,i)=>{ series.forEach((sr,j)=>{ const v=per[k][sr]||0,h=Math.abs(v)/max*(H-52)/2;
      const x=P+8+i*gw+j*(bw+2)+(gw-series.length*(bw+2))/2, y=v>=0?zero-h:zero;
      const col=v<0?"var(--neg)":(series.length>1?(sr==="Vyltic"?"var(--vy)":"var(--we)"):(scope==="welltold"?"var(--we)":"var(--vy)"));
      s+='<rect data-t="'+esc(sr+" "+k+": "+fmt(v))+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="3" fill="'+col+'"/>'; });
    s+='<text x="'+(P+8+i*gw+gw/2-1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle">'+k.slice(2).replace("-","/")+'</text>'; });
  s+='<text x="'+(P-4)+'" y="'+(zero+3)+'" font-size="10" text-anchor="end">0</text></svg>';
  wrap.innerHTML+=s;
  wrap.addEventListener("mousemove",ev=>{ const r=ev.target.closest("rect[data-t]"); let t=document.querySelector(".ttip");
    if(!r){ if(t)t.remove(); return; } if(!t){ t=el("div","ttip"); document.body.appendChild(t); }
    t.textContent=r.getAttribute("data-t"); t.style.left=(ev.clientX+12)+"px"; t.style.top=(ev.clientY-10)+"px"; });
  wrap.addEventListener("mouseleave",()=>{const t=document.querySelector(".ttip");if(t)t.remove();});
  return wrap;
}

/* ============ ledger ============ */
function viewLedger(m){
  const f=el("div","filters");
  const months=[...new Set(entriesArr().map(({e})=>(e.date||"").slice(0,7)))].sort().reverse();
  const selM=el("select"); selM.innerHTML='<option value="">All months</option>'+months.map(x=>'<option>'+x+'</option>').join("");
  const selA=el("select"); selA.innerHTML='<option value="">All accounts</option>'+COA.map(a=>'<option value="'+a[0]+'">'+a[0]+" · "+esc(a[1])+'</option>').join("");
  const q=el("input"); q.placeholder="Search text / party / #"; q.style.flex="1"; q.style.minWidth="140px";
  const exp=el("button","btn2","Export CSV");
  f.append(selM,selA,q,exp); m.appendChild(f);
  const wrap=el("div","tablewrap"); m.appendChild(wrap);
  const cnt=el("p","meta",""); m.appendChild(cnt);
  const open=new Set();
  const rows=()=>{
    const mv=selM.value, av=selA.value, qv=q.value.trim().toLowerCase();
    return entriesArr().filter(({e})=>{
      if(mv&&(e.date||"").slice(0,7)!==mv) return false;
      if(av&&!e.lines.some(l=>l.code===av)) return false;
      if(qv){ const blob=(e.n+" "+e.lines.map(l=>(l.party||"")+" "+(l.desc||"")).join(" ")).toLowerCase(); if(!blob.includes(qv)) return false; }
      return true;
    }).sort((a,b)=>a.e.date<b.e.date?1:a.e.date>b.e.date?-1:b.e.n-a.e.n);
  };
  const draw=()=>{
    const list=rows(); let tot=0; list.forEach(({e})=>tot+=e.lines.reduce((a,l)=>a+(+l.dr),0));
    let h='<table class="gl"><thead><tr><th>#</th><th>Date</th><th>Memo</th><th>Co.</th><th class="num">Amount</th></tr></thead><tbody>';
    list.slice(0,400).forEach(({id,e})=>{
      const cos=[...new Set(e.lines.map(l=>l.co))];
      h+='<tr class="je" data-id="'+esc(id)+'"><td class="mono">'+e.n+'</td><td class="mono">'+esc(e.date||"")+'</td><td>'+esc((e.lines[0]||{}).desc||"")+'</td><td>'+cos.map(c=>'<span class="pill '+(c==="Vyltic"?"vy":"we")+'">'+(c||"?")[0]+'</span>').join(" ")+'</td><td class="num">'+fmt(e.lines.reduce((a,l)=>a+(+l.dr),0))+'</td></tr>';
      if(open.has(id)){
        h+='<tr class="lines"><td colspan="5"><table class="linetbl">';
        e.lines.forEach(l=>{h+='<tr><td>'+esc(l.code)+' '+esc(l.account)+'</td><td>'+esc(l.party||"")+'</td><td>'+esc(l.desc||"")+'</td><td class="num mono">'+((+l.dr)?fmt(+l.dr):"")+'</td><td class="num mono">'+((+l.cr)?"("+fmt(+l.cr)+")":"")+'</td></tr>';});
        h+='</table></td></tr>';
      }
    });
    wrap.innerHTML=h+'</tbody></table>';
    wrap.querySelectorAll("tr.je").forEach(r=>r.onclick=()=>{const id=r.getAttribute("data-id");open.has(id)?open.delete(id):open.add(id);draw();});
    cnt.textContent=list.length+" entries · gross movement "+fmt(tot)+(list.length>400?" · showing first 400":"");
  };
  exp.onclick=()=>{
    let rc=[["entry","date","code","account","party","description","debit","credit","company"]];
    rows().slice().reverse().forEach(({e})=>e.lines.forEach(l=>rc.push([e.n,e.date,l.code,l.account,l.party||"",l.desc||"",l.dr,l.cr,l.co||""])));
    const csv=rc.map(r=>r.map(x=>{x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="wahj-books-"+scope+"-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  [selM,selA,q].forEach(x=>x.oninput=draw); draw();
}

/* ============ record (draft builder) ============ */
function blankLine(co){ return {code:"",party:"",desc:"",dr:"",cr:"",co:co}; }
function viewRecord(m){
  const c=el("div","submitcol");
  const defCo=scope==="welltold"?"Welltold":"Vyltic";
  c.appendChild(el("p","meta","Build the entry here (or paste the JSON your AI drafted from the Guide briefing), check it balances, then send it to Ahmed — his Claude posts it to the books and the site updates for everyone within a minute or two."));
  const ta=el("textarea","raw"); ta.placeholder='Describe it, or paste AI JSON:  {"date":"2026-09-05","lines":[...]}';
  c.appendChild(ta);
  const row=el("div","actions");
  const bParse=el("button","btn","Use it");
  const bManual=el("button","btn2","Blank lines");
  row.append(bParse,bManual); c.appendChild(row);
  const zone=el("div"); c.appendChild(zone); m.appendChild(c);
  const renderDraft=()=>{
    zone.innerHTML=""; if(!draft) return;
    zone.appendChild(el("h2","sec","Draft entry"));
    const meta=el("div","filters");
    const di=el("input"); di.type="date"; di.value=draft.date; di.onchange=()=>draft.date=di.value;
    const mi=el("input"); mi.placeholder="Memo"; mi.style.flex="1"; mi.value=draft.memo||""; mi.oninput=()=>draft.memo=mi.value;
    meta.append(di,mi); zone.appendChild(meta);
    const t=el("table","drafttbl"); t.innerHTML='<tr><th>Account</th><th>Party</th><th>Description</th><th class="amt">Debit</th><th class="amt">Credit</th><th>Co.</th><th></th></tr>';
    draft.lines.forEach((l,i)=>{
      const tr=el("tr");
      const sel=el("select","cd"); sel.innerHTML='<option value=""></option>'+COA.map(a=>'<option value="'+a[0]+'"'+(a[0]===l.code?" selected":"")+'>'+a[0]+" · "+esc(a[1])+'</option>').join(""); sel.onchange=()=>l.code=sel.value;
      const p=el("input"); p.value=l.party||""; p.setAttribute("list","plist"); p.oninput=()=>l.party=p.value;
      const d=el("input"); d.value=l.desc||""; d.oninput=()=>l.desc=d.value;
      const dr=el("input","amt"); dr.type="number"; dr.step="0.01"; dr.value=l.dr; dr.oninput=()=>{l.dr=dr.value;bal();};
      const cr=el("input","amt"); cr.type="number"; cr.step="0.01"; cr.value=l.cr; cr.oninput=()=>{l.cr=cr.value;bal();};
      const co=el("select","cosel"); co.innerHTML='<option'+(l.co==="Vyltic"?" selected":"")+'>Vyltic</option><option'+(l.co==="Welltold"?" selected":"")+'>Welltold</option>'; co.onchange=()=>l.co=co.value;
      const x=el("button","btn3 danger","✕"); x.onclick=()=>{draft.lines.splice(i,1);renderDraft();};
      [sel,p,d,dr,cr,co,x].forEach(n=>{const td=el("td");td.appendChild(n);tr.appendChild(td);});
      t.appendChild(tr);
    });
    zone.appendChild(t);
    const dl=el("datalist"); dl.id="plist";
    dl.innerHTML=[...new Set(entriesArr().flatMap(({e})=>e.lines.map(l=>l.party)).filter(Boolean))].sort().map(p=>'<option value="'+esc(p)+'">').join("");
    zone.appendChild(dl);
    const add=el("button","btn3","+ add line"); add.onclick=()=>{draft.lines.push(blankLine(defCo));renderDraft();}; zone.appendChild(add);
    const br=el("div","balrow"); zone.appendChild(br);
    const out=el("pre","brief"); out.style.display="none";
    const acts=el("div","actions");
    const bCopy=el("button","btn","Copy entry for Ahmed");
    acts.append(bCopy); zone.appendChild(acts); zone.appendChild(out);
    if(draft.notes) zone.appendChild(el("p","meta","AI note: "+esc(draft.notes)));
    const clean=()=>({date:draft.date,memo:draft.memo||"",requested_by:WHO,
      lines:draft.lines.filter(l=>l.code&&((+l.dr||0)||(+l.cr||0))).map(l=>({code:l.code,account:(COA.find(a=>a[0]===l.code)||["",""])[1],party:(l.party||"").trim(),desc:(l.desc||draft.memo||"").trim(),dr:+(+l.dr||0).toFixed(2),cr:+(+l.cr||0).toFixed(2),co:l.co||defCo})),
      notes:draft.notes||""});
    const bal=()=>{ const D=draft.lines.reduce((a,l)=>a+(+l.dr||0),0),C=draft.lines.reduce((a,l)=>a+(+l.cr||0),0),off=Math.abs(D-C)>0.004;
      br.innerHTML='<span class="mono">Dr '+fmt(D)+'</span><span class="mono">Cr '+fmt(C)+'</span><span class="'+(off?"off":"ok")+'">'+(off?"off by "+fmt(D-C):"balanced")+'</span>';
      bCopy.disabled=off||!D; return !off&&D>0; };
    bal();
    bCopy.onclick=()=>{ if(!bal())return;
      const j=JSON.stringify(clean(),null,1);
      out.style.display="block"; out.textContent=j;
      if(navigator.clipboard) navigator.clipboard.writeText(j).then(()=>toast("Copied — send it to Ahmed (WhatsApp or his Claude chat)."));
      else toast("Select and copy the JSON below, then send it to Ahmed."); };
  };
  bManual.onclick=()=>{ draft={date:new Date().toISOString().slice(0,10),memo:"",notes:"",lines:[blankLine(defCo),blankLine(defCo)]}; renderDraft(); };
  bParse.onclick=()=>{
    const txt=ta.value.trim(); if(!txt){ toast("Type or paste something first."); return; }
    const j=txt.match(/\{[\s\S]*\}/);
    if(j){ try{ const o=JSON.parse(j[0]);
        if(Array.isArray(o.lines)){ draft={date:o.date||new Date().toISOString().slice(0,10),memo:o.memo||"",notes:o.notes||"",lines:o.lines.map(l=>({code:String(l.code||""),party:l.party||"",desc:l.desc||l.descr||"",dr:l.dr||"",cr:l.cr||"",co:l.co||l.company||defCo}))}; renderDraft(); return; } }catch(e){} }
    draft={date:new Date().toISOString().slice(0,10),memo:txt.slice(0,80),notes:"",lines:[blankLine(defCo),blankLine(defCo)]};
    renderDraft();
    toast("No AI JSON found — fill the lines manually, or get JSON from your AI using the Guide briefing.");
  };
}

/* ============ guide ============ */
function viewGuide(m){
  const g=el("div","guide");
  g.innerHTML='<h3>What this is</h3><p>The live books of <strong>Wahj</strong> — Vyltic and Welltold. Your access code decides what you see: Vyltic, Welltold, or everything (Consolidated). The data files are encrypted; without a code they are unreadable, and each code only opens its own part.</p>'
  +'<h3>How entries get in</h3><p>Ahmed&rsquo;s Claude keeps the books: send receipts, amounts, or a drafted entry to Ahmed (or build one in the <strong>Record</strong> tab and copy it). Once posted, the site updates for everyone within a minute or two — refresh to see it.</p>'
  +'<h3>Using your own AI</h3><p>Copy the briefing below into any AI chat (Claude, ChatGPT&hellip;), tell it what happened, and it will reply with a ready entry in exactly the right format. Paste that JSON into the Record tab to check it balances, then send it to Ahmed.</p>'
  +'<h3>Reading the numbers</h3><p>Cash is one pooled bank balance for the whole entity — a company&rsquo;s share can be negative (the other side funds it). Lines marked <code>IC Intercompany</code> only exist to balance cross-company entries inside a single-company view. The Welltold profit share (⅓ Joud + ⅓ Rami of the monthly net) is booked centrally at month-end.</p>'
  +'<h3>Your access code</h3><p>Treat it like a key: anyone who has it sees what it opens. If a code leaks or someone leaves, tell Ahmed — his Claude re-locks the books with fresh codes in minutes. This device stays signed in until you sign out.</p>';
  const cp=el("button","btn2","Copy AI briefing"); cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(RULES).then(()=>toast("Copied."));};
  g.appendChild(cp);
  const pre=el("pre","brief"); pre.textContent=RULES; g.appendChild(pre);
  const out=el("button","btn3","Sign out"); out.style.marginTop="16px"; out.onclick=signOut;
  g.appendChild(out);
  m.appendChild(g);
}

boot();
