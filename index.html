<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wahj Books</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F3F4F1; --ink:#1C2321; --muted:#5B6663; --faint:#8B948F;
  --line:#E4E7E3; --line2:#D5DAD4;
  --acc:#4B55C4; --acc-ink:#FFFFFF; --acc-soft:rgba(75,85,196,.12);
  --vy:#0A8A5C; --we:#C2620A;
  --neg:#B42318; --chip:#EEF0EC; --focus:#2C6BD8;
  --shadow:0 1px 2px rgba(20,24,22,.06),0 4px 14px rgba(20,24,22,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --surface:#1B1F1D; --surface2:#222724; --ink:#ECEFED; --muted:#9AA5A0; --faint:#6E7873;
    --line:#2A302D; --line2:#39413D;
    --acc:#8B93E8; --acc-ink:#10211C; --acc-soft:rgba(139,147,232,.18);
    --vy:#1E9E8A; --we:#CE7B1F;
    --neg:#E8695A; --chip:#262C29; --focus:#7FA7EE;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1B1F1D; --surface2:#222724; --ink:#ECEFED; --muted:#9AA5A0; --faint:#6E7873;
  --line:#2A302D; --line2:#39413D;
  --acc:#8B93E8; --acc-ink:#10211C; --acc-soft:rgba(139,147,232,.18);
  --vy:#1E9E8A; --we:#CE7B1F;
  --neg:#E8695A; --chip:#262C29; --focus:#7FA7EE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wordmark{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.codot{width:10px;height:10px;border-radius:3px;background:var(--acc);display:inline-block}
.scopes{display:flex;gap:6px}
.scopes button{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;color:var(--muted)}
.scopes button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
nav.tabs button[aria-selected="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
h2.sec{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:17px;font-weight:600;margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.tile .v.neg{color:var(--neg)}
.duo{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
@media(max-width:760px){.duo{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chartwrap{overflow-x:auto}
.legend{display:flex;gap:14px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.recents{display:flex;flex-direction:column}
.recent{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.recent:last-child{border-bottom:0}
.recent .d{color:var(--faint);font-size:12px;flex:none;width:44px}
.recent .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .a{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.filters input,.filters select{padding:6px 9px;font-size:13px}
.filters .flbl{font-size:12px;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.gl{border-collapse:collapse;width:100%;min-width:760px}
table.gl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface)}
table.gl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
table.gl .num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:11px;border-radius:99px;padding:1px 8px;background:none;white-space:nowrap;border:1px solid var(--line2);color:var(--muted)}
.pill.vy{color:var(--vy);border-color:var(--vy)}
.pill.we{color:var(--we);border-color:var(--we)}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:9px;padding:9px 16px}
.btn[disabled]{opacity:.55;cursor:default}
.btn2{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-weight:500}
.btn3{color:var(--acc);font-weight:600;padding:8px 10px;border-radius:8px}
.btn3:hover{background:var(--acc-soft)}
.danger{color:var(--neg)}
.submitcol{max-width:720px}
textarea.raw{width:100%;min-height:96px;resize:vertical}
.drafttbl{width:100%;border-collapse:collapse;margin-top:8px}
.drafttbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px}
.drafttbl td{padding:3px 4px}
.drafttbl input,.drafttbl select{width:100%;padding:5px 7px;font-size:13px;border-radius:7px}
.drafttbl .amt{width:92px}
.drafttbl .cd{width:150px}
.drafttbl .cosel{width:96px}
.balrow{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:13px}
.balrow .ok{color:var(--vy);font-weight:600}
.balrow .off{color:var(--neg);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.guide{max-width:760px}
.guide h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:15px;margin:20px 0 6px}
.guide p,.guide li{font-size:13.5px}
.guide code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--chip);border-radius:5px;padding:1px 5px}
pre.brief{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:pre-wrap;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:50;max-width:88vw}
.authbox{max-width:400px;margin:9vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.authbox h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:22px;margin:0 0 4px;display:flex;gap:9px;align-items:center}
.authbox p{color:var(--muted);font-size:13px;margin:4px 0 16px}
.authbox form{display:flex;flex-direction:column;gap:9px}
.authbox .err{color:var(--neg);font-size:13px;min-height:18px;margin:6px 0 0}
svg text{fill:var(--muted);font-family:"IBM Plex Sans",sans-serif}
.ttip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:7px;padding:5px 9px;z-index:60;white-space:nowrap}
.skel{height:80px;border-radius:12px;background:var(--surface2)}
/* Excel-style reports */
.xlhead{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.02em;margin:14px 0 8px}
table.xl{border-collapse:collapse;min-width:520px}
table.xl td{padding:3px 10px;font-size:13px;border-bottom:1px solid var(--line)}
table.xl td.a{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:110px}
table.xl tr.l0 td{font-weight:700;border-top:2px solid var(--line2);background:var(--surface2)}
table.xl tr.l1 td{font-weight:600}
table.xl tr.grand td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
table.xl td.i1{padding-left:28px}
table.xl td.i2{padding-left:46px}
table.xl td.i3{padding-left:64px}
table.xl td .noamt{color:var(--faint)}
table.xlm{border-collapse:collapse}
table.xlm th{font-size:11px;color:var(--muted);padding:4px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
table.xlm th:first-child{text-align:left}
table.xlm td{padding:3px 8px;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.xlm td.a{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
table.xlm tr.l0 td{font-weight:600;background:var(--surface2)}

.xlwrap{max-height:78vh;overflow:auto}
table.xl{min-width:520px}
table.xl th{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.xl th.a{text-align:right}
table.xl td:first-child,table.xl th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);min-width:220px;max-width:340px}
table.xl th:first-child{z-index:4;background:var(--surface2)}
table.xl tr.l0 td:first-child{background:var(--surface2)}
table.gl thead th{z-index:3}
#totop{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#totop.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#totop{transition:none}}
.admtbl{width:100%;border-collapse:collapse}
.admtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px}
.admtbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle;font-size:13px}
.admtbl label{margin-right:9px;font-size:13px;white-space:nowrap}
.listcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.listcols .card h4{margin:0 0 8px;font-size:13px;font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif}
.listcols .card div{font-size:13px;padding:2px 0;border-bottom:1px dashed var(--line)}
.listcols .card div:last-child{border-bottom:0}
.listcols .card form.addrow{display:flex;gap:6px;margin-top:8px}
.listcols .card form.addrow input{flex:1;min-width:0;padding:5px 8px;font-size:13px}
#coaadd{align-items:center}
.admtbl .num{text-align:right}
.admtbl th.num{text-align:right}
.admtbl .nowrap{white-space:nowrap}
table.assets{min-width:1560px}
table.assets .btn3{padding:3px 6px;font-size:12px}
table.assets td{padding:5px 6px;font-size:12.5px}
table.assets th{white-space:nowrap}
table.assets input{padding:4px 6px;font-size:12.5px}
table.assets .pill{white-space:nowrap}
table.emps td{padding:5px 6px;font-size:12.5px}
table.emps th{white-space:nowrap}
table.emps input,table.emps select{padding:4px 6px;font-size:12.5px}
table.emps .btn3{padding:3px 6px;font-size:12px;white-space:nowrap}
.pend{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 12px}
.pend h4{margin:0 0 8px;font-size:13.5px}
.pend .tablewrap{padding:0}
.admtbl td.permcell{text-align:center}
.admtbl th.permh{text-align:center}
#addperson label{white-space:nowrap}
table.emps input.changed{border-color:var(--vy);box-shadow:0 0 0 2px rgba(80,80,200,.12)}
table.emps{min-width:1720px}
.mono.warn{color:#b45309;font-weight:600}
table.admtbl tr.tot td{font-weight:700;border-top:2px solid var(--line2)}
table.gl tr.tbg td{font-weight:700;background:var(--surface2);border-top:2px solid var(--line2)}
table.gl td.i1{padding-left:28px}
table.gl td.i2{padding-left:48px;color:var(--muted)}
table.gl tr.tbp td{font-size:12px}
label.tick{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
table.gl.tb th:nth-child(1),table.gl.tb td:nth-child(1){position:sticky;left:0;z-index:2;background:var(--surface);width:52px;min-width:52px}
table.gl.tb th:nth-child(2),table.gl.tb td:nth-child(2){position:sticky;left:var(--c1,72px);z-index:2;background:var(--surface);min-width:200px;max-width:320px}
table.gl.tb th:nth-child(1),table.gl.tb th:nth-child(2),table.gl.glx th:first-child,table.emps th:first-child{z-index:4}
table.gl.tb tr.tbg td:nth-child(1),table.gl.tb tr.tbg td:nth-child(2){background:var(--surface2)}
table.gl.glx td:first-child,table.gl.glx th:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}
table.emps td:first-child,table.emps th:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}
table.subs{min-width:1380px}
table.subs tr.ended td{opacity:.55}

/* ---- v4.18: chrome (grouped nav, search, theme), dashboard ---- */
:root{--c1:#4B55C4;--c2:#C2620A;--c3:#0A8A5C;--c4:#B8336A;--c5:#1D82C9;--c6:#8A6D1F;--c7:#6B4FB3;--c8:#7A8580;--warn:#B45309;--good:#0A8A5C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#8B93E8;--c2:#E08A2E;--c3:#2DB38F;--c4:#E26A9C;--c5:#4FA5E6;--c6:#C9A24A;--c7:#A68CE6;--c8:#8E9994;--warn:#E0A253;--good:#2DB38F}}
:root[data-theme="dark"]{--c1:#8B93E8;--c2:#E08A2E;--c3:#2DB38F;--c4:#E26A9C;--c5:#4FA5E6;--c6:#C9A24A;--c7:#A68CE6;--c8:#8E9994;--warn:#E0A253;--good:#2DB38F}
.mono.warn{color:var(--warn)}
.hrow.nav{padding-top:0;padding-bottom:6px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.search{position:relative;display:flex;align-items:center}
.search .sico{position:absolute;left:9px;color:var(--faint);display:flex}
.search input{padding-left:30px;width:min(360px,44vw);border-radius:99px;font-size:13px}
.sres{position:absolute;top:calc(100% + 6px);right:0;width:min(560px,92vw);background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:4px}
.sr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.sr:hover{background:var(--acc-soft)}
.sr .d{color:var(--faint);font-size:12px;flex:none}
.sr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .a{flex:none}
.sr.more{color:var(--acc);font-weight:600;justify-content:center;gap:6px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--acc-soft);color:var(--acc)}
.iconbtn[disabled]{opacity:.4;cursor:default}
.me{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--line)}
.me .who{font-weight:600;font-size:13px}
.me .meta{font-size:11px}
nav.tabs{margin-left:0;gap:8px;align-items:center;padding-bottom:2px;flex-wrap:wrap;overflow:visible}
nav.tabs .grp{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 2px;border-radius:10px;background:var(--surface2)}
nav.tabs .glbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:0 6px 0 8px}
nav.tabs button{padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
nav.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:10.5px;padding:0 6px;line-height:16px;font-weight:700}
/* dashboard */
.dtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.dtitle .h{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.15}
.dctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dctl input[type=month]{padding:5px 8px;font-size:13px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:2px;margin-left:6px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--acc);font-weight:600;box-shadow:var(--shadow)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
@media(min-width:1000px){.kgrid.k6{grid-template-columns:repeat(3,1fr)}.kgrid.k7,.kgrid.k8{grid-template-columns:repeat(4,1fr)}.kgrid.k5{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.kpi.link{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi.link:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--line2)}
.khead{display:flex;align-items:center;gap:8px}
.kico{display:inline-flex;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:5px}
.help{margin-left:auto;width:18px;height:18px;border-radius:99px;border:1px solid var(--line2);color:var(--faint);font-size:11px;display:inline-flex;align-items:center;justify-content:center;cursor:help}
.kval{font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.kval.neg{color:var(--neg)}
.kspark{height:28px}
.spark{display:block}
.ksub{font-size:12px;color:var(--muted);line-height:1.35}
.delta{font-weight:700;font-size:12px;border-radius:6px;padding:0 5px}
.delta.up{color:var(--good);background:rgba(10,138,92,.12)}
.delta.dn{color:var(--neg);background:rgba(180,35,24,.10)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{font-size:11px;background:var(--chip);border-radius:99px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.drow{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;margin-top:12px}
@media(max-width:860px){.drow{grid-template-columns:1fr}.dtitle .h{font-size:20px}}
.dcard{padding:14px 16px 12px;margin-top:12px}
.drow .dcard{margin-top:0}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}

<body>
<header class="app" id="hdr" hidden><div class="hrow">
  <span class="wordmark"><span class="codot"></span>Wahj Books</span>
  <span class="scopes" id="scopes"></span>
  <div class="tools" id="tools"></div>
</div><div class="hrow nav"><nav class="tabs" id="tabs" role="tablist"></nav></div></header>
<main id="main"><div class="skel"></div></main>
<button id="totop" aria-label="Scroll to top">↑ Top</button>

<script>
"use strict";
/* ---------- reference data (loaded from data/coa.enc + data/lists.enc after sign-in) ---------- */
let COA=[], LISTS={}, ACC={}, REVC=[], COSC=[], OPXC=[];
function indexCoA(){
  ACC={}; COA.forEach(a=>ACC[a[0]]={code:a[0],name:a[1],type:a[2],normal:a[3],group:a[4],cf:a[5]});
  REVC=COA.filter(a=>a[2]==="Revenue").map(a=>a[0]); COSC=COA.filter(a=>a[4]==="Cost of Sales").map(a=>a[0]); OPXC=COA.filter(a=>a[4]==="Operating Expenses").map(a=>a[0]);
}
const GROUPS={Asset:["Current Assets","Fixed Assets","Intangible Assets"],Liability:["Current Liabilities","Long-term Liabilities"],Equity:["Equity"],Revenue:["Income"],Expense:["Cost of Sales","Operating Expenses"]};
const TYPE_DIGIT={Asset:"1",Liability:"2",Equity:"3",Revenue:"4",Expense:"5"};
const CFCLASSES=["Operating","Investing","Financing","Cash"];
const RULES=`WAHJ BOOKS - BRIEFING FOR ANY AI ASSISTANT (drafting journal entries)

Entity: Wahj (Jordan). Two brands in one company: Vyltic (padel events, matchmaking, venue SaaS) and Welltold ("Wiltord") (marketing agency). Currency JOD, 2 decimals. One bank pool; every line carries "co": "Vyltic" or "Welltold".

Rules:
1. Double entry - total debits (dr) must equal total credits (cr).
2. Cash in/out (incl. company Visa card) -> code 1000 Cash. Cash OUT credits 1000; cash IN debits 1000.
3. Revenue billed but not collected -> Dr 1100 Accounts Receivable (party = client, add "[unpaid]" to desc). Collection later: Dr 1000 / Cr 1100 "clears #<entry>".
4. Welltold revenue: retainers -> 4510, projects/content/videos -> 4530. Vyltic revenue: tournaments -> 4030, venue commissions & matchmaking -> 4080, venue SaaS -> 4090, sponsorship -> 4070.
5. From Aug 2026 marketing invoices MAY carry 16% sales tax - only when the invoice shows it: revenue net to 4xxx, tax to Cr 2200 Taxes Payable.
6. Client withheld 5% withholding tax when paying: book revenue GROSS; the withheld 5% -> Dr 1300 Prepaid Expenses, party "Withholding Tax".
7. Salaries: mid-month payments to staff are advances -> Dr 1100 (party = person). Month-end salary expense Dr 5100 clears the advances (Cr 1100) or accrues Cr 2000 "[unpaid]".
8. Welltold delivery costs (freelancers, camera rental, client-work designers) -> 5150 or 5900. They reduce the monthly profit-share net.
9. PROFIT SHARE (Welltold): Joud 1/3 + Rami 1/3 of monthly NET (revenue - 5150/5900 - 5100 Welltold). NEVER draft it - booked centrally at month-end. Loss month = no share.
10. Small office/misc -> 5340. Recruiting/ads -> 5200. Software/domains/emails -> 5250. Rent/utilities/telecom -> 5300. Equipment -> 1500 (party = category, e.g. "IT & Computer Equipment", "Furniture & Fixtures"). App development -> 1710.
11. USD charges: JOD = USD x 0.738; add "true-up vs bank" to desc.
12. Use party names already in the books when they exist. A receipt's amount beats a remembered amount.
13. Never draft "IC Intercompany" lines and never invent account codes.

Output EXACTLY this JSON (paste it in the site's Entry tab to check it balances; a Maker can post it, anyone else sends it to Ahmed):
{"date":"YYYY-MM-DD","memo":"short memo","lines":[{"code":"1000","account":"Cash","party":"","desc":"","dr":0,"cr":0,"co":"Vyltic"}],"notes":"anything uncertain, else empty"}`;

/* ---------- helpers ---------- */
const fmt=n=>{const x=Math.round((+n+Number.EPSILON)*100)/100; return (x<0?"−":"")+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m,ms){const t=el("div","toast",esc(m));document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3800);}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const te=s=>new TextEncoder().encode(s), td=b=>new TextDecoder().decode(b);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sha256hex(s){const h=await crypto.subtle.digest("SHA-256",te(s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const today=()=>new Date().toISOString().slice(0,10);
const lastDate=()=>{ let d=today(); Object.values(DATA).forEach(x=>Object.values(x||{}).forEach(e=>{ if(e.date>d) d=e.date; })); return d; };
const r2=x=>Math.round((+x||0)*100+Number.EPSILON)/100;
const xlSerial=d=>Math.round((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(1899,11,30))/86400000);

let META=null, KEYS={}, RAW={}, WHO="", DATA={}, PAT="", NAMES={};
let tab="Dashboard", scope="";
let draft=null;
try{ tab=localStorage.getItem("wahj.tab")||"Dashboard"; scope=localStorage.getItem("wahj.scope")||""; }catch(e){}
const ord={vyltic:0,welltold:1,consolidated:2};
const scopeLabel={vyltic:"Vyltic",welltold:"Welltold",consolidated:"Consolidated"};
const COSCOPE={Vyltic:"vyltic",Welltold:"welltold"};
const entriesArr=()=>{ const d=DATA[scope]||{}; return Object.keys(d).sort().map(k=>({id:k,e:d[k]})); };

/* ---------- crypto / auth (email + password; keys unwrapped client-side) ---------- */
let ME=null, ADMIN=null, MYEMAIL="";
const SUPER="ahmad@vyltic.com";
async function deriveKek(pw,salt){
  const km=await crypto.subtle.importKey("raw",te(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:META.iter,hash:"SHA-256"},km,256);
  return new Uint8Array(bits);
}
const kekKey=async raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
async function unwrapAll(u,kekRaw){
  const k=await kekKey(kekRaw); const raw={};
  for(const [s,w] of Object.entries(u.keys||{})){
    try{ raw[s]=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(w.iv)},k,b64d(w.ct))); }catch(e){ return null; }
  }
  return raw;
}
async function installKeys(rawMap){
  KEYS={}; RAW={};
  for(const [s,b] of Object.entries(rawMap)){ RAW[s]=b; KEYS[s]=await crypto.subtle.importKey("raw",b,{name:"AES-GCM"},false,["encrypt","decrypt"]); }
}
const isAdmin=()=>!!KEYS.admin;
/* ---------- permissions: per-person rights (CoA / Lists / Posting / Entries), admins hold all four ---------- */
const PERM_KEYS=["coa","lists","post","entries"];
const PERM_LABEL={coa:"CoA",lists:"Lists",post:"Posting",entries:"Entries"};
let PERMS={};
const normPerms=p=>{ const o={}; PERM_KEYS.forEach(k=>o[k]=!!(p&&p[k])); return o; };
const allPerms=()=>({coa:true,lists:true,post:true,entries:true});
const anyPerm=p=>PERM_KEYS.some(k=>p&&p[k]);
function setPerms(u,raw){ PERMS=raw.admin?allPerms():(u&&u.perms?normPerms(u.perms):(raw.maker?allPerms():normPerms(null))); }
const can=k=>!!PERMS[k]&&!!PAT;
const canMake=()=>!!PAT&&PERM_KEYS.some(k=>PERMS[k]);
const rightsLabel=()=>isAdmin()?"Admin":(PERM_KEYS.filter(k=>PERMS[k]).map(k=>PERM_LABEL[k]).join(", ")||"Viewer");
const myCompanies=()=>["vyltic","welltold"].filter(s=>KEYS[s]);
const myScopes=()=>{ const s=myCompanies(); if(KEYS.consolidated&&s.length===2) s.push("consolidated"); return s; };

/* ---------- data files: 12-byte IV + AES-GCM ciphertext ---------- */
const GH_API=(location.hostname==="localhost"||location.hostname==="127.0.0.1")?location.origin+"/repos/WahjBooks/wahjbooks.github.io":"https://api.github.com/repos/WahjBooks/wahjbooks.github.io";
async function fetchBlob(name){
  if(PAT){ try{ const r=await fetch(GH_API+"/contents/data/"+name+"?t="+Date.now(),{headers:{Authorization:"Bearer "+PAT,Accept:"application/vnd.github.raw+json"}}); if(r.ok) return new Uint8Array(await r.arrayBuffer()); }catch(e){} }
  const r=await fetch("data/"+name+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("Couldn’t load "+name); return new Uint8Array(await r.arrayBuffer());
}
const MAGIC=[0,87,66,52]; // "\0WB4": a leading NUL keeps GitHub from transcoding the file as text
const hasMagic=b=>b.length>16&&MAGIC.every((v,i)=>b[i]===v);
async function openBytes(buf,keyName){ if(hasMagic(buf)) buf=buf.slice(4); const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEYS[keyName],buf.slice(12)); return JSON.parse(td(pt)); }
async function openBlob(name,keyName){ return openBytes(await fetchBlob(name+".enc"),keyName); }
async function sealBlob(obj,keyName){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},KEYS[keyName],te(JSON.stringify(obj)))); const out=new Uint8Array(16+ct.length); out.set(MAGIC); out.set(iv,4); out.set(ct,16); return out; }
function stripIC(e){ return Object.assign({},e,{lines:e.lines.filter(l=>l.code!=="IC")}); }
function mergeCons(V,W){
  const out={}; [...new Set([...Object.keys(V),...Object.keys(W)])].sort().forEach(id=>{
    const src=V[id]||W[id]; const e=Object.assign({},src); e.lines=[...((V[id]||{}).lines||[]),...((W[id]||{}).lines||[])].filter(l=>l.code!=="IC"); out[id]=e; });
  return out;
}
async function loadScope(s){
  if(DATA[s]) return;
  if(s==="consolidated"){ await loadScope("vyltic"); await loadScope("welltold"); DATA.consolidated=mergeCons(DATA.vyltic||{},DATA.welltold||{}); return; }
  if(!KEYS[s]) return;
  DATA[s]=await openBlob(s,s);
}
async function loadRefs(){
  if(KEYS.maker){ try{ const mk=await openBlob("maker","maker"); PAT=mk.pat||""; NAMES=mk.names||{}; }catch(e){ PAT=""; } }
  [LISTS,COA]=await Promise.all([openBlob("lists","common"),openBlob("coa","common")]); indexCoA();
}

/* ---------- boot ---------- */
async function boot(){
  const m=document.getElementById("main");
  try{ META=await (await fetch("data/meta.json?t="+Date.now(),{cache:"no-store"})).json(); }
  catch(e){ m.innerHTML='<div class="authbox"><h1><span class="codot"></span>Wahj Books</h1><p>Couldn’t load the data files. Check your connection and refresh.</p></div>'; return; }
  let sess=null; try{ sess=JSON.parse(sessionStorage.getItem("wahj.sess")||"null"); }catch(e){}
  if(sess&&sess.email&&sess.kek){
    for(let pass=0;pass<2;pass++){
      const u=await findUser(sess.email);
      if(u){ const raw=await unwrapAll(u,b64d(sess.kek)); if(raw&&Object.keys(raw).length){ MYEMAIL=sess.email; await installKeys(raw); setPerms(u,raw); WHO=sess.email; return enter(); } }
      if(pass===0){ const fresh=await freshMeta(); if(!fresh||JSON.stringify(fresh)===JSON.stringify(META)) break; META=fresh; }
    }
    try{ sessionStorage.removeItem("wahj.sess"); }catch(e){}
  }
  renderAuth(m);
}
async function findUser(email){ const eh=await sha256hex(email.trim().toLowerCase()); return (META.users||[]).find(u=>u.ehash===eh)||null; }
async function freshMeta(){   // the repo copy of meta.json (the site repo is public, so no token is needed) — GitHub Pages can lag a few minutes behind a save
  try{ const r=await fetch(GH_API+"/contents/data/meta.json?t="+Date.now(),{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"}); if(!r.ok) return null; const m=await r.json(); return (m&&m.users)?m:null; }catch(e){ return null; }
}
async function tryUnlock(email,pw){   // → {u,kek,raw} or null. Sign-in checks the repo's saved copy of meta.json first (a password reset is in it at once); the published Pages copy is the fallback
  const attempt=async()=>{ const u=await findUser(email); if(!u) return null; const kek=await deriveKek(pw,b64d(u.salt)); const raw=await unwrapAll(u,kek); return raw&&Object.keys(raw).length?{u,kek,raw}:null; };
  const fresh=await freshMeta(); if(fresh) META=fresh;   // the published copy is only used when the repo copy cannot be fetched
  return attempt();
}
function renderAuth(m){
  document.getElementById("hdr").hidden=true;
  m.innerHTML="";
  const b=el("div","authbox");
  b.innerHTML='<h1><span class="codot"></span>Wahj Books</h1><p>Sign in to the company books.</p>';
  const f=el("form");
  const inp=el("input"); inp.type="email"; inp.placeholder="Email"; inp.autocomplete="username"; inp.required=true;
  const pw=el("input"); pw.type="password"; pw.placeholder="Password"; pw.autocomplete="current-password"; pw.required=true;
  const go=el("button","btn","Sign in"); go.type="submit";
  const err=el("div","err","");
  f.append(inp,pw,go,err);
  f.onsubmit=async ev=>{ ev.preventDefault(); go.disabled=true; go.textContent="Signing in…"; err.textContent="";
    const email=inp.value.trim().toLowerCase();
    const got=await tryUnlock(email,pw.value);
    if(!got){ err.textContent="Wrong email or password, or this email has no access."; go.disabled=false; go.textContent="Sign in"; return; }
    const {u,kek,raw}=got;
    MYEMAIL=email; await installKeys(raw); setPerms(u,raw); WHO=email;
    try{ sessionStorage.setItem("wahj.sess",JSON.stringify({email,kek:b64e(kek)})); }catch(e){}
    enter();
  };
  b.appendChild(f);
  b.appendChild(el("p","meta","Forgot your password? Ask Ahmed (or any admin) to reset it."));
  m.appendChild(b);
}
async function enter(){
  document.getElementById("hdr").hidden=false;
  const m=document.getElementById("main"); m.innerHTML='<div class="skel"></div>';
  try{ await loadRefs(); }
  catch(e){ m.innerHTML='<div class="authbox"><h1><span class="codot"></span>Wahj Books</h1><p>Couldn’t open the reference data ('+esc(e.message)+'). Refresh, or ask an admin to re-save people & permissions.</p></div>'; return; }
  if(NAMES[MYEMAIL]) WHO=NAMES[MYEMAIL];
  if(!myScopes().includes(scope)) scope=myScopes().sort((a,b)=>ord[b]-ord[a])[0];
  if(!scope){ m.innerHTML='<div class="authbox"><h1><span class="codot"></span>Wahj Books</h1><p>Your account has no company access yet. Ask an admin.</p></div>'; return; }
  await loadScope(scope);
  renderScopes(); renderTools(); renderTabs(); render();
  if(KEYS.maker&&!PENDING) loadPending().then(()=>renderTabs()).catch(()=>{});
}
function signOut(){ try{sessionStorage.removeItem("wahj.sess");}catch(e){} location.reload(); }

/* ---------- chrome ---------- */
function renderScopes(){
  const n=document.getElementById("scopes"); n.innerHTML="";
  myScopes().sort((a,b)=>ord[a]-ord[b]).forEach(s=>{ const b=el("button","",scopeLabel[s]);
    b.setAttribute("aria-pressed",s===scope?"true":"false");
    b.onclick=async()=>{ scope=s; try{localStorage.setItem("wahj.scope",s);}catch(e){} await loadScope(s); renderScopes(); render(); };
    n.appendChild(b); });
}
function tabsList(){
  const t=["Dashboard","P&L","Balance Sheet","Cash Flow","Receivables","Payables","GL","Trial Balance","Lists","CoA"];
  if(can("entries")||can("post")) t.push("Entry","Pending");
  if(assetsOK()) t.push("Assets","Clients");
  if(closingOK()) t.push("Employees","Closing");
  t.push("Guide"); if(isAdmin()) t.push("Admin");
  return t;
}
function render(){
  const m=document.getElementById("main"); m.innerHTML="";
  if(!tabsList().includes(tab)) tab="Dashboard";
  renderTabs();
  ({"Dashboard":viewDash,"P&L":viewPL,"Balance Sheet":viewBS,"Cash Flow":viewCF,"Receivables":viewReceivables,"Payables":viewPayables,"GL":viewGL,"Trial Balance":viewTB,"Lists":viewLists,"CoA":viewCoA,"Entry":viewEntry,"Pending":viewPending,"Assets":viewAssets,"Clients":viewClients,"Employees":viewEmployees,"Closing":viewClosing,"Guide":viewGuide,"Admin":viewAdmin})[tab](m);
}

/* ---------- report engine ---------- */
function allLines(){ const out=[]; entriesArr().forEach(({e})=>e.lines.forEach(l=>out.push({e,l}))); return out; }
function months(){ return [...new Set(entriesArr().map(({e})=>(e.date||"").slice(0,7)))].sort(); }
function monthEnd(k){ const y=+k.slice(0,4), m=+k.slice(5,7); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); }
function mlabel(k){ return new Date(k+"-15T00:00:00Z").toLocaleString("en",{month:"short",timeZone:"UTC"})+" "+k.slice(0,4); }
function aggregate(from,to){
  const byCode={},byParty={};
  allLines().forEach(({e,l})=>{ if(from&&e.date<from) return; if(to&&e.date>to) return;
    const v=(+l.dr)-(+l.cr); byCode[l.code]=(byCode[l.code]||0)+v;
    const bp=byParty[l.code]=byParty[l.code]||{}; const p=l.party||"(unassigned)"; bp[p]=(bp[p]||0)+v; });
  return {byCode,byParty};
}
function periodCols(st){
  if(st.view==="total") return [{label:"Total",from:st.from,to:st.to}];
  const ms=months().filter(k=>k>=st.from.slice(0,7)&&k<=st.to.slice(0,7));
  return ms.map(k=>({label:mlabel(k),from:st.view==="cumulative"?st.from:(k+"-01"),to:monthEnd(k)<st.to?monthEnd(k):st.to}));
}
const nz=a=>a.some(v=>Math.abs(v)>=0.005);
const addv=(a,b)=>a.map((v,i)=>v+b[i]);
const subv=(a,b)=>a.map((v,i)=>v-b[i]);
/* report settings remembered per browser (wahj.reports): the period is shared by P&L, Cash Flow, Trial Balance and GL; level/view per report; Balance Sheet "as at" follows the last "to" date */
let REP={}; try{ REP=JSON.parse(localStorage.getItem("wahj.reports")||"{}")||{}; }catch(e){ REP={}; }
function repSave(){ try{ localStorage.setItem("wahj.reports",JSON.stringify(REP)); }catch(e){} }
function repState(key,defaults){
  const st=REP[key]=REP[key]||{}; Object.keys(defaults).forEach(k=>{ if(st[k]===undefined) st[k]=defaults[k]; });
  if(defaults.from!==undefined){ if(REP.from) st.from=REP.from; if(REP.to) st.to=REP.to; }
  if(defaults.asOf!==undefined&&REP.asOf) st.asOf=REP.asOf;
  return st;
}
function repChange(st,ch){ Object.assign(st,ch); if(ch.from!==undefined) REP.from=ch.from; if(ch.to!==undefined){ REP.to=ch.to; REP.asOf=ch.to; } if(ch.asOf!==undefined) REP.asOf=ch.asOf; repSave(); render(); }
function optRow(m,st,onchange,views,ticks){
  const f=el("div","filters");
  if(st.level!==undefined){
    f.appendChild(el("span","flbl","Level:"));
    const s=el("select"); s.innerHTML='<option value="1">1 — sections</option><option value="3">3 — accounts</option><option value="10">10 — accounts + parties</option>';
    s.value=String(st.level); s.onchange=()=>onchange({level:+s.value}); f.appendChild(s);
  }
  if(views){
    f.appendChild(el("span","flbl","View:"));

/* ---------- writes to the books (GitHub contents API, sha-checked; retried on conflicts) ---------- */
async function ghGet(path){
  const h={Authorization:"Bearer "+PAT,Accept:"application/vnd.github+json"};
  const r=await fetch(GH_API+"/contents/"+path+"?t="+Date.now(),{headers:h});
  if(r.status===404) return {sha:null,bytes:null};
  if(!r.ok) throw new Error("GitHub read failed ("+r.status+")");
  const j=await r.json();
  if(j.content) return {sha:j.sha,bytes:b64d(j.content.replace(/\s/g,""))};
  const r2=await fetch(GH_API+"/contents/"+path+"?t="+Date.now(),{headers:{Authorization:"Bearer "+PAT,Accept:"application/vnd.github.raw+json"}});
  if(!r2.ok) throw new Error("GitHub read failed ("+r2.status+")");
  return {sha:j.sha,bytes:new Uint8Array(await r2.arrayBuffer())};
}
async function ghPutSha(path,bytes,msg,sha){
  const body={message:msg+"\n\nCo-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>",content:b64e(bytes)};
  if(sha) body.sha=sha;
  const r=await fetch(GH_API+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+PAT,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  return r.status;
}
async function ghUpdate(path,keyName,mutate,msg){
  if(!PAT) throw new Error("You don’t have Maker access.");
  for(let i=0;i<6;i++){
    const {sha,bytes}=await ghGet(path);
    let obj=bytes?(keyName?await openBytes(bytes,keyName):JSON.parse(td(bytes))):null;
    obj=await mutate(obj);
    const out=keyName?await sealBlob(obj,keyName):te(JSON.stringify(obj));
    const st=await ghPutSha(path,out,msg,sha);
    if(st===200||st===201) return obj;
    if(st===409||st===422){ await sleep(400+Math.random()*600); continue; }
    if(st===401||st===403) throw new Error("GitHub refused the save ("+st+") — the site’s token may have been revoked; tell Ahmed.");
    throw new Error("GitHub write failed ("+st+")");
  }
  throw new Error("Too many people saving at once — try again.");
}

/* ---------- month-end closing: employees register, depreciation, salaries, Welltold profit share ---------- */
let CLOSING=null;

async function ledgerAll(){ await loadScope("vyltic"); await loadScope("welltold"); if(!DATA.consolidated) DATA.consolidated=mergeCons(DATA.vyltic||{},DATA.welltold||{}); return Object.values(DATA.consolidated); }
function linesWhere(entries,f){ const out=[]; entries.forEach(e=>e.lines.forEach(l=>{ if(f(e,l)) out.push({e,l}); })); return out; }
const sumDr=xs=>r2(xs.reduce((a,{l})=>a+(+l.dr)-(+l.cr),0));
function seedClosing(entries){
  const c={v:1,employees:[],assets:[],settings:{shareRate:1/3,shareParties:["Joud","Rami"],shareAccount:"5040",depAccount:"5400",accDepAccount:"1600",salaryAccount:"5100",carryForward:false},runs:{}};
  refreshAssets(c,entries);
  // employees: everyone with a salary line this year; last amount & company; current if paid in the latest payroll month
  const last={}, months=new Set();
  linesWhere(entries,(e,l)=>l.code==="5100"&&e.date>=(new Date().getFullYear())+"-01-01"&&(+l.dr)>0).forEach(({e,l})=>{ const p=(l.party||"").trim(); if(!p) return; months.add(e.date.slice(0,7));
    const cur=last[p]; if(!cur||e.date>cur.date) last[p]={date:e.date,co:l.co,amount:0}; });
  const ms=[...months].sort(); const latest=ms.slice(-2);
  Object.keys(last).forEach(p=>{ const m=last[p].date.slice(0,7); last[p].amount=r2(sumDr(linesWhere(entries,(e,l)=>l.code==="5100"&&l.party===p&&e.date.slice(0,7)===m&&l.co===last[p].co))); });
  (LISTS["Employees"]||[]).forEach(p=>{ if(!last[p]) last[p]={date:"",co:"Vyltic",amount:0}; });
  Object.keys(last).sort().forEach(p=>c.employees.push({id:"e"+Math.random().toString(36).slice(2,8),name:p,company:last[p].co||"Vyltic",center:"",salary:last[p].amount||0,status:latest.includes(last[p].date.slice(0,7))?"current":"stopped",note:""}));
  return c;
}
function refreshAssets(c,entries){
  const live=new Set(); entries.forEach(e=>e.lines.forEach((l,i)=>{ if(l.code==="1500") live.add(e.n+":"+i); }));
  c.assets=c.assets.filter(a=>!a.src||live.has(a.src)||a.disposal);   // a purchase reclassed or deleted from the books leaves the register too
  const have=new Set(c.assets.map(a=>a.src)); let added=0;
  entries.forEach(e=>e.lines.forEach((l,i)=>{ if(l.code!=="1500") return; const src=e.n+":"+i; if(have.has(src)) return;
    const cost=r2((+l.dr)-(+l.cr)); const cat=l.party||"(uncategorised)";
    c.assets.push({id:"a"+Math.random().toString(36).slice(2,8),src,n:e.n,date:e.date,start:e.date.slice(0,7),ready:e.date,salvage:0,category:cat,desc:l.desc||"",cost,co:l.co||"Vyltic",life:DEFAULT_LIVES[cat]||0}); added++; }));
  c.assets.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n-b.n);
  return added;
}
async function loadClosing(){

function apOwed(entries,party){ return r2(linesWhere(entries,(e,l)=>l.code==="2000"&&l.party===party).reduce((a,{l})=>a+(+l.cr)-(+l.dr),0)); }
function advanceOf(entries,party,upTo){ return Math.max(0,sumDr(linesWhere(entries,(e,l)=>l.code==="1100"&&l.party===party&&e.date<=upTo))); }
function accruedIn(entries,party,m,code){ return r2(linesWhere(entries,(e,l)=>l.code===(code||"2000")&&l.party===party&&e.date.slice(0,7)===m).reduce((a,{l})=>a+(+l.cr),0)); }
function lastCo(entries,party){ let d="",co="Vyltic"; linesWhere(entries,(e,l)=>l.code==="2000"&&l.party===party&&(+l.cr)>0).forEach(({e,l})=>{ if(e.date>=d){ d=e.date; co=l.co; } }); return co; }
async function payParty(entries,party,amount,label){

function paidCell(entries,party,accrued,label,after,booked){
  const td=el("td"); const owed=apOwed(entries,party);

  else { lab.append(" paid? (owed "+fmt(owed)+")"); cb.onchange=async()=>{ cb.disabled=true; try{ const n=await payParty(entries,party,Math.min(accrued,owed),label); if(n){ toast("Paid — entry #"+n+"."); after(); } else { cb.checked=false; cb.disabled=false; } }catch(e){ toast("Not posted: "+e.message,7000); cb.checked=false; cb.disabled=false; } }; }

/* ---- employees: start/end dates + effective-dated assignments (company / cost center / salary) ---- */
const DAY_MS=86400000;
const dUTC=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const dayBefore=s=>new Date(dUTC(s)-DAY_MS).toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((dUTC(b)-dUTC(a))/DAY_MS)+1;
const dLabel=s=>{ const d=new Date(dUTC(s)); return d.getUTCDate()+" "+d.toLocaleString("en",{month:"short",timeZone:"UTC"}); };
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
function empNorm(p,entries){
  if(!Array.isArray(p.assignments)||!p.assignments.length) p.assignments=[{from:"",company:p.company||"Vyltic",center:p.center||"",salary:r2(p.salary||0)}];
  p.assignments.forEach(a=>{ a.from=isDate(a.from)?a.from:""; a.company=a.company||"Vyltic"; a.center=a.center||""; a.salary=r2(a.salary||0); a.treat=a.treat==="capital"?"capital":"expense"; });
  p.assignments.sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0); p.assignments[0].from="";
  if(entries&&p.name){ const ds=linesWhere(entries,(e,l)=>l.code==="5100"&&l.party===p.name&&(+l.dr)>0).map(({e})=>e.date).sort();
    if(p.start==null){ p.start=ds.length?ds[0].slice(0,7)+"-01":""; if(ds.length) p.startGuess=true; }
    if(p.status==="stopped"&&!p.end&&ds.length) p.end=monthEnd(ds[ds.length-1].slice(0,7)); }
  if(!isDate(p.start)) p.start=""; if(!isDate(p.end)) p.end=""; if(p.note==null) p.note="";
  delete p.status;
  const cur=empCurrent(p); p.company=cur.company; p.center=cur.center; p.salary=cur.salary;   // mirror of the latest assignment (older code paths)
  return p;
}
const TREAT_LABEL={expense:"Expensed",capital:"Capitalised"};
function closeMonth(){ viewClosing.st=viewClosing.st||{month:idxMonth(monthIdx(thisMonth())-1)}; return viewClosing.st; }
function empEligible(p,mo){ return empSegments(p,mo).reduce((a,g)=>a+g.days,0); }
function daysWorked(c,p,mo){ const o=((c.months||{})[mo]||{})[p.id]; const elig=empEligible(p,mo); const has=!!(o&&o.days!=null);
  return {elig,days:has?Math.max(0,Math.min(r2(o.days),elig)):elig,override:has,note:(o&&o.note)||""}; }
function setDaysWorked(c,p,mo,days,note){ c.months=c.months||{}; const m=(c.months[mo]=c.months[mo]||{}); const elig=empEligible(p,mo);
  const d=(days===""||days==null)?null:Math.max(0,Math.min(r2(days),elig));
  if(d==null||(Math.abs(d-elig)<0.004&&!note)) delete m[p.id]; else m[p.id]={days:d,note:note||""}; }
function applyDays(c,p,mo,segs){ const dw=daysWorked(c,p,mo); if(dw.override&&dw.elig>0){ const f=dw.days/dw.elig; segs.forEach(g=>{ g.worked=r2(g.days*f); g.amount=r2((+g.a.salary||0)*g.days*f/g.D); }); } else segs.forEach(g=>{ g.worked=g.days; }); return dw; }
function salaryLinesFor(c,entries,name,mo){ const capA=treatAccount(c,"capital"), expA=treatAccount(c,"expense"); return linesWhere(entries,(e,l)=>(l.code===expA||l.code===capA)&&l.party===name&&(!mo||e.date.slice(0,7)===mo)); }
const treatAccount=(c,t)=>t==="capital"?(c.settings.capAccount||"1710"):(c.settings.salaryAccount||"5100");
function treatSelect(val,onchange){ const sel=el("select"); sel.className="treat"; sel.innerHTML='<option value="expense"'+(val!=="capital"?" selected":"")+'>Expensed</option><option value="capital"'+(val==="capital"?" selected":"")+'>Capitalised</option>'; sel.title="Expensed = salary cost (5100). Capitalised = added to App Development (1710) instead of the P&L."; sel.onchange=()=>onchange(sel.value); return sel; }
function empCurrent(p,date){ const d=date||today(); let cur=p.assignments[0]; p.assignments.forEach(a=>{ if(!a.from||a.from<=d) cur=a; }); return cur; }
function empActiveIn(p,mo){ const m1=mo+"-01", mE=monthEnd(mo); return (!p.start||p.start<=mE)&&(!p.end||p.end>=m1); }
function empStatus(p){ const t=today();
  if(p.end&&p.end<t) return {key:"ended",label:"Ended "+p.end};
  if(p.start&&p.start>t) return {key:"starts",label:"Starts "+p.start};
  return {key:"current",label:"Current"+(p.end?" · ends "+p.end:"")}; }
const DAY_BASIS=30;   // salaries are on a 30-day month: a full month = 30 days whatever the calendar says; a partial month counts the calendar days on payroll, never more than 30
function empSegments(p,mo){   // the month split by start/end and by assignment changes; amount = salary × days / 30
  const m1=mo+"-01", mE=monthEnd(mo), D=DAY_BASIS;
  const s=p.start&&p.start>m1?p.start:m1, e=p.end&&p.end<mE?p.end:mE; if(s>e) return [];
  const whole=s===m1&&e===mE;
  const as=p.assignments, segs=[];
  as.forEach((a,i)=>{ const af=a.from||"0000-01-01", at=i+1<as.length?dayBefore(as[i+1].from):"9999-12-31";
    const f=af>s?af:s, t=at<e?at:e; if(f>t) return; segs.push({from:f,to:t,days:daysBetween(f,t),D,a}); });
  let cum=0; segs.forEach(g=>{ g.days=Math.max(0,Math.min(g.days,D-cum)); cum+=g.days; });   // the 31st never counts
  if(whole&&segs.length&&cum<D) segs[segs.length-1].days+=D-cum;                             // February still pays a full 30
  return segs.filter(g=>g.days>0).map(g=>Object.assign(g,{full:whole&&segs.length===1,amount:r2((+g.a.salary||0)*g.days/D)}));
}

function salaryLinesOf(c,mo,co,rows){   // one company's salary entry lines for a month: Dr 5100/1710 per person; Cr 1100 (advance cleared) / Cr 2000 [unpaid]
  const lines=[];
  rows.forEach(r=>{ const acct=treatAccount(c,r.treat); const g=r.g;
    const d=r.p.name+" — "+monthName(mo)+" salary"+(g.a.center?" ("+g.a.center+")":"")+(g.full&&!(g.worked<g.days)?"":" · "+(g.full?"":dLabel(g.from)+"–"+dLabel(g.to)+" ")+"("+(g.worked!=null?g.worked:g.days)+"/"+g.D+" days)")+(r.treat==="capital"?" · capitalised":"");
    lines.push({code:acct,account:(ACC[acct]||{}).name||acct,party:r.p.name,desc:d,dr:r.salary,cr:0,co});
    if(r.advance>0.004) lines.push({code:"1100",account:ACC["1100"].name,party:r.p.name,desc:d+" — clears advance",dr:0,cr:r.advance,co});
    const rest=r2(r.salary-r.advance); if(rest>0.004) lines.push({code:"2000",account:ACC["2000"].name,party:r.p.name,desc:d+" [unpaid]",dr:0,cr:rest,co}); });
  return lines;
}
const lineKey=l=>[l.co,l.code,l.party,r2(l.dr).toFixed(2),r2(l.cr).toFixed(2)].join("|");
function sameLines(a,b){ const ka=a.map(lineKey).sort(), kb=b.map(lineKey).sort(); return ka.length===kb.length&&ka.every((k,i)=>k===kb[i]); }
function secSalaries(zone,c,entries,mo){
  const end=monthEnd(mo);
  zone.appendChild(el("h2","sec","1 · Salaries — "+monthName(mo)));
  const emps=c.employees.filter(p=>p.name&&empActiveIn(p,mo));
  const names=new Set(c.employees.map(p=>p.name).filter(Boolean));
  const capA=treatAccount(c,"capital"), expA=treatAccount(c,"expense");
  const isSal=l=>l.code===expA||l.code===capA;
  const rec=(c.runs[mo]||{}).salaries; const recNos=[...new Set(((rec&&rec.entries)||[]).map(Number))]; const adNos=[...new Set(((rec&&rec.adopted)||[]).map(Number))];
  const entryCo=e=>e.lines[0].co;
  // the month's salary entries — rewritten in place by a re-run: the site's own run, plus salary entries booked by hand
  // (one company; only salary / advance / payable lines; every salary line a register name and described as a salary)
  const shaped=e=>e.date.slice(0,7)===mo&&e.lines.length>0&&e.lines.some(isSal)&&e.lines.every(l=>(isSal(l)||l.code==="1100"||l.code==="2000")&&l.co===entryCo(e));
  const handBooked=e=>e.lines.filter(isSal).every(l=>names.has(l.party)&&/salar/i.test((l.desc||"")+" "+(e.memo||"")));
  const site=entries.filter(e=>shaped(e)&&(recNos.includes(+e.n)||adNos.includes(+e.n)||handBooked(e))).sort((a,b)=>+a.n-+b.n);
  const siteNos=site.map(e=>+e.n); const siteRef=siteNos.map(n=>"#"+n).join(", ");
  const base=siteNos.length?entries.filter(e=>!siteNos.includes(+e.n)):entries;   // the books without those entries, so a re-run works out advances and bookings afresh
  if(!emps.length&&!siteNos.length){ zone.appendChild(el("p","meta","Nobody is on payroll in "+monthName(mo)+" (Employees tab: check the start and end dates).")); return; }
  const t=el("table","admtbl"); t.innerHTML='<tr><th>Employee</th><th>Period</th><th>Company</th><th>Center</th><th>Books to</th><th class="num">Salary</th><th class="num">Advance to clear</th><th class="num">Accrue (unpaid)</th><th>Booked</th><th>Paid</th></tr>';
  const plan=[]; let anyToRun=false; const skipped=[], dropped=[], changes=[]; const carry={}; const seen=new Set();
  const siteLinesOf=name=>{ const out=[]; site.forEach(e=>e.lines.forEach(l=>{ if(l.party===name) out.push({e,l}); })); return out; };
  const holder=name=>site.find(e=>e.lines.some(l=>isSal(l)&&l.party===name));   // the entry that holds this person's salary today
  emps.forEach(p=>{
    seen.add(p.name);
    const mine=salaryLinesFor(c,base,p.name,mo); const booked=r2(sumDr(mine));
    const inSite=siteLinesOf(p.name); const bookedSite=r2(sumDr(inSite.filter(({l})=>isSal(l)))); const ref=[...new Set(inSite.map(({e})=>"#"+e.n))].join(", ");
    if(booked>0.004){   // booked in an entry the re-run does not touch (e.g. paid in cash straight to 1710): shown as is
      inSite.forEach(({e,l})=>{ (carry[+e.n]=carry[+e.n]||[]).push(l); });   // any line of theirs in a re-runnable entry is kept exactly as it is
      const tr=el("tr"); tr.appendChild(el("td","",esc(p.name))); tr.appendChild(el("td","meta","—"));
      tr.appendChild(el("td","",esc([...new Set(mine.map(({l})=>l.co))].join("/"))));
      tr.appendChild(el("td","",esc(empCurrent(p,end).center||"—"))); tr.appendChild(el("td","mono",esc([...new Set(mine.map(({l})=>l.code))].join("/"))));  tr.appendChild(el("td","num mono",fmt(r2(booked+bookedSite)))); tr.appendChild(el("td","num mono","")); tr.appendChild(el("td","num mono",fmt(accruedIn(entries,p.name,mo))));
      tr.appendChild(el("td","",'<span class="pill vy">booked '+esc([...new Set(mine.map(({e})=>"#"+e.n).concat(inSite.map(({e})=>"#"+e.n)))].join(", "))+'</span>'));
      tr.appendChild(paidCell(entries,p.name,accruedIn(entries,p.name,mo),p.name+" — "+monthName(mo)+" salary",()=>{ DATA.consolidated=null; render(); },r2(booked+bookedSite)));
      t.appendChild(tr); return;
    }
    const all=empSegments(p,mo); const dw=applyDays(c,p,mo,all); const segs=all.filter(g=>g.amount>0.004);
    if(!segs.length){ skipped.push(p.name+(dw.override?" (0 days)":"")); if(bookedSite>0.004) dropped.push(p.name+" ("+fmt(bookedSite)+" in "+ref+")"); return; }
    anyToRun=true;
    const adv=advanceOf(base,p.name,end);
    const planned=r2(segs.reduce((a,x)=>a+x.amount,0)); const same=Math.abs(bookedSite-planned)<0.004;
    if(bookedSite>0.004&&!same) changes.push(p.name+" "+fmt(bookedSite)+" → "+fmt(planned)); else if(!(bookedSite>0.004)&&siteNos.length) changes.push(p.name+" not booked yet ("+fmt(planned)+")");
    segs.forEach((g,i)=>{
      const row={p,g,company:g.a.company,treat:g.a.treat||"expense",salary:g.amount,advance:i===0?Math.min(adv,g.amount):0}; plan.push(row);
      const tr=el("tr"); tr.appendChild(el("td","",i===0?esc(p.name):""));
      tr.appendChild(el("td","meta nowrap",(g.full?"full month":esc(dLabel(g.from)+"–"+dLabel(g.to)+" · "+g.days+"/"+g.D+" days"))+(dw.override?'<br><b>'+esc(dw.days+" of "+dw.elig+" days worked")+'</b>'+(dw.note?" · "+esc(dw.note):""):"")));
      const co=el("select"); co.innerHTML=myCompanies().map(s=>'<option'+(scopeLabel[s]===g.a.company?" selected":"")+'>'+scopeLabel[s]+'</option>').join(""); co.onchange=()=>row.company=co.value; const td2=el("td"); td2.appendChild(co); tr.appendChild(td2);
      tr.appendChild(el("td","",esc(g.a.center||"—")));
      const ts=treatSelect(row.treat,v=>{ row.treat=v; }); ts.style.fontSize="12px"; const tdt=el("td"); tdt.appendChild(ts); tr.appendChild(tdt);
      const sa=el("input","amt mono"); sa.type="number"; sa.step="0.01"; sa.value=row.salary; sa.style.width="100px"; if(!g.full||dw.override) sa.title=fmt(g.a.salary)+" × "+(g.worked||g.days)+"/"+g.D+" days"; const td4=el("td","num"); td4.appendChild(sa); tr.appendChild(td4);
      const td5=el("td","num");
      const acc=el("td","num mono",fmt(row.salary-row.advance));
      if(i===0){ const ad=el("input","amt mono"); ad.type="number"; ad.step="0.01"; ad.value=row.advance; ad.style.width="100px"; ad.title="Open advances (1100) for this person: "+fmt(adv); td5.appendChild(ad); if(adv>0.004) td5.appendChild(el("div","meta","open "+fmt(adv)));
        const upd=()=>{ row.salary=r2(sa.value); row.advance=Math.min(r2(ad.value),row.salary); acc.textContent=fmt(row.salary-row.advance); }; sa.oninput=upd; ad.oninput=upd; }
      else { td5.className="num mono"; td5.textContent=""; sa.oninput=()=>{ row.salary=r2(sa.value); acc.textContent=fmt(row.salary); }; }
      tr.appendChild(td5); tr.appendChild(acc);
      if(i>0){ tr.appendChild(el("td","meta","")); tr.appendChild(el("td","meta","")); }

  });
  // people in those entries who are no longer on the register for this month
  site.forEach(e=>e.lines.forEach(l=>{ if(isSal(l)&&l.party&&!seen.has(l.party)){ seen.add(l.party); dropped.push(l.party+" ("+fmt(r2(l.dr-l.cr))+" in #"+e.n+", not on the register this month)"); } }));

  const diff=rows=>{ const target={}, fresh={}, byP={};
    rows.forEach(r=>{ if(r.salary>0.004){ const k=r.p.name; byP[k]=byP[k]||{}; (byP[k][r.company]=byP[k][r.company]||[]).push(r); } });
    Object.entries(byP).forEach(([name,cos])=>{ const h=holder(name); Object.entries(cos).forEach(([co,rs])=>{ const lines=salaryLinesOf(c,mo,co,rs); const e=(h&&entryCo(h)===co)?h:mainFor(co); if(e) (target[+e.n]=target[+e.n]||[]).push(...lines); else (fresh[co]=fresh[co]||[]).push(...lines); }); });
    Object.entries(carry).forEach(([n,lines])=>{ (target[n]=target[n]||[]).push(...lines); });
    const upd=site.filter(e=>target[+e.n]).map(e=>({e,co:entryCo(e),lines:target[+e.n]}));

        for(const x of d.upd){ await updateEntry(COSCOPE[x.co],+x.e.n,{date:end,memo:memoFor(x),lines:x.lines}); (recNos.includes(+x.e.n)?nos:adopted).push(+x.e.n); did.push("updated #"+x.e.n); }

        for(const x of d.del){ await deleteEntry(COSCOPE[entryCo(x)],+x.n); did.push("deleted #"+x.n); }

        todo.forEach(r=>{ const e=rs.emps[r.p.name]=rs.emps[r.p.name]||{company:"",salary:0,advance:0,segments:[]};
          e.segments.push({from:r.g.from,to:r.g.to,days:r.g.days,worked:r.g.worked!=null?r.g.worked:r.g.days,company:r.company,center:r.g.a.center,treat:r.treat,amount:r.salary,advance:r.advance}); e.company=[...new Set(e.segments.map(s=>s.company))].join("/"); e.salary=r2(e.salary+r.salary); e.advance=r2(e.advance+r.advance); });

      catch(e){ toast("Not posted: "+e.message,8000); b.disabled=false; b.textContent=label; } };

}

async function updateEntry(sc,n,patch){   // rewrite an existing entry in place (same number) — used by re-runnable closing items
  const id=String(n).padStart(4,"0");
  const data=await ghUpdate("data/"+sc+".enc",sc,o=>{ if(!o||!o[id]) throw new Error("Entry #"+n+" is not in the "+scopeLabel[sc]+" books."); o[id]=Object.assign({},o[id],patch,{by:MYEMAIL,at:nowIso()}); return o; },"Update entry #"+n+" ("+scopeLabel[sc]+")");
  DATA[sc]=data; delete DATA.consolidated; if(scope==="consolidated") await loadScope("consolidated");
}
async function deleteEntry(sc,n){   // remove an entry the site itself booked (a re-run with nobody left in that company)
  const id=String(n).padStart(4,"0");
  const data=await ghUpdate("data/"+sc+".enc",sc,o=>{ if(!o||!o[id]) throw new Error("Entry #"+n+" is not in the "+scopeLabel[sc]+" books."); delete o[id]; return o; },"Delete entry #"+n+" ("+scopeLabel[sc]+", re-run)");
  DATA[sc]=data; delete DATA.consolidated; if(scope==="consolidated") await loadScope("consolidated");
}
function shareLinesFor(s,b,mo,base,each){   // the entry lines for a month's share (profit: Dr 5040 / Cr 2000; loss: Dr 2000 / Cr 5040)

  s.shareParties.forEach(p=>{ const d="Welltold "+(loss?"loss":"profit")+" share — "+p+" (1/3 of "+monthName(mo)+" NET "+fmt(base)+")";
    if(loss){ lines.push({code:"2000",account:ACC["2000"].name,party:p,desc:d+" — netted against payable",dr:amt,cr:0,co:"Welltold"}); lines.push({code:s.shareAccount,account:ACC[s.shareAccount].name,party:p,desc:d,dr:0,cr:amt,co:"Welltold"}); }
    else { lines.push({code:s.shareAccount,account:ACC[s.shareAccount].name,party:p,desc:d,dr:amt,cr:0,co:"Welltold"}); lines.push({code:"2000",account:ACC["2000"].name,party:p,desc:d+" [unpaid]",dr:0,cr:amt,co:"Welltold"}); } });
  return lines;
}

function shareBasis(entries,mo){   // Welltold net for the month = revenue − every Welltold cost except the share itself (Ahmed 8 Sep 2026: "the share is on the net profit")
  const sa=(CLOSING&&CLOSING.settings&&CLOSING.settings.shareAccount)||"5040";
  let rev=0,del=0,sal=0,oth=0; linesWhere(entries,(e,l)=>l.co==="Welltold"&&e.date.slice(0,7)===mo).forEach(({l})=>{ if(l.code[0]==="4") rev+=(+l.cr)-(+l.dr); else if(l.code==="5150"||l.code==="5900") del+=(+l.dr)-(+l.cr); else if(l.code==="5100") sal+=(+l.dr)-(+l.cr); else if(l.code[0]==="5"&&l.code!==sa) oth+=(+l.dr)-(+l.cr); });
  return {rev:r2(rev),del:r2(del),sal:r2(sal),oth:r2(oth),net:r2(rev-del-sal-oth)};
}

async function loadAdmin(){

  ADMIN=await openBlob("admin","admin");

  ADMIN.people.forEach(p=>{ p.perms=p.perms?normPerms(p.perms):((p.admin||p.role==="maker")?allPerms():normPerms(null)); if(p.admin) p.perms=allPerms(); });

const wantKeys=p=>["common",...p.scopes,...((p.admin||anyPerm(p.perms))?["maker"]:[]),...(p.admin?["admin"]:[])];
async function saveAdmin(msg){
  const users=[];
  for(const p of ADMIN.people){
    if(p.scopes.includes("consolidated")&&!(p.scopes.includes("vyltic")&&p.scopes.includes("welltold"))) p.scopes=p.scopes.filter(s=>s!=="consolidated");
    p.perms=p.admin?allPerms():normPerms(p.perms); p.role=anyPerm(p.perms)?"maker":"viewer";
    const k=await kekKey(b64d(p.kek)); const keys={};
    for(const s of wantKeys(p)){ if(!RAW[s]) throw new Error("You can’t grant "+s+" — you don’t hold it yourself.");
      const iv=crypto.getRandomValues(new Uint8Array(12));
      keys[s]={iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,RAW[s]))}; }
    users.push({ehash:await sha256hex(p.email),salt:p.salt,keys,perms:p.perms});
  }
  const meta2={v:4,iter:META.iter,updated:new Date().toISOString().slice(0,16).replace(/[-:]/g,""),users};
  const names={}; ADMIN.people.forEach(p=>names[p.email]=p.name||"");
  const pat=ADMIN.pat||PAT;
  await ghUpdate("data/admin.enc","admin",()=>Object.assign({},ADMIN,{pat}),msg);
  await ghUpdate("data/maker.enc","maker",o=>Object.assign(o||{},{pat,names}),msg);
  await ghUpdate("data/meta.json",null,()=>meta2,msg);
  META=meta2; NAMES=names;
  const me=ADMIN.people.find(p=>p.email===MYEMAIL); if(me) PERMS=me.admin?allPerms():normPerms(me.perms);
}

      const rm=el("button","btn3 danger","Remove"); rm.disabled=(p.email===SUPER);
      rm.onclick=()=>{ if(confirm("Remove "+(p.name||p.email)+"’s access?")){ ADMIN.people.splice(idx,1); render(); } };
      acts.append(rp,rm); td6.appendChild(acts); tr.appendChild(td6);
      t.appendChild(tr);
    });
    const wrap=el("div","tablewrap"); wrap.style.padding="8px 12px"; wrap.appendChild(t); zone.appendChild(wrap);
    zone.appendChild(el("h2","sec","Add a person"));
    const f=el("div","filters"); f.id="addperson";
    const np={name:"",email:"",scopes:[],perms:normPerms(null),admin:false};
    const nname=el("input"); nname.placeholder="Name"; nname.oninput=()=>np.name=nname.value.trim();
    const nemail=el("input"); nemail.type="email"; nemail.placeholder="email@example.com"; nemail.style.minWidth="210px";
    const npw=el("input"); npw.placeholder="First password (10+ chars)"; npw.value=genPassword(); npw.className="mono"; npw.style.minWidth="170px";
    const nperm=el("span"); const npt=permTicks(np); npt.cells.forEach((td,i)=>{ const lab=el("label"); lab.appendChild(td.firstChild); lab.append(" "+PERM_LABEL[PERM_KEYS[i]]); nperm.appendChild(lab); });
    const nadm=el("label"); const nacb=el("input"); nacb.type="checkbox"; nacb.disabled=!RAW.admin; nacb.onchange=()=>{ np.admin=nacb.checked; npt.sync(); }; nadm.appendChild(nacb); nadm.append(" Admin");
    const add=el("button","btn2","Add");
    f.append(nname,nemail,npw,scopeTicks(np),nperm,nadm,add); zone.appendChild(f);
    add.onclick=async()=>{ const em=nemail.value.trim().toLowerCase(); if(!em.includes("@")){ toast("Enter a valid email."); return; }
      if(ADMIN.people.some(p=>p.email===em)){ toast("That email is already in the list."); return; }
      if(!np.scopes.length){ toast("Tick at least one company."); return; }
      if(npw.value.length<10){ toast("Password: at least 10 characters."); return; }
      const p={name:np.name,email:em,scopes:np.scopes.slice(),perms:np.admin?allPerms():normPerms(np.perms),role:(np.admin||anyPerm(np.perms))?"maker":"viewer",admin:np.admin}; await setPassword(p,npw.value); ADMIN.people.push(p);
      toast("Added. Click Save changes, then tell "+(p.name||em)+" their password: "+npw.value,9000); render(); };
    const acts=el("div","actions");
    const save=el("button","btn","Save changes");
    save.onclick=async()=>{ save.disabled=true; save.textContent="Saving…";
      try{ await saveAdmin("Update people & rights"); toast("Saved. Publishing to the site takes 1–3 minutes; sign-in already uses the saved copy.",7000); renderTabs(); watchPublish(); }
      catch(e){ toast("Save failed: "+e.message,7000); }
      save.disabled=false; save.textContent="Save changes"; };
    acts.append(save);
    if(RAW.admin){ const tk=el("button","btn2","Replace GitHub token…"); tk.title="Paste a new GitHub token for the site's saves (a fine-grained token limited to this repository, Contents: read & write). The old one keeps working until you revoke it on GitHub."; tk.style.marginLeft="8px";
      tk.onclick=async()=>{ const v=(prompt("New GitHub token for the site's saves (it is checked against the repository, then saved for everyone with a write right — it is never shown again):")||"").trim(); if(!v) return;
        if(!/^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(v)){ toast("That doesn't look like a GitHub token (ghp_… or github_pat_…)."); return; }
        tk.disabled=true; tk.textContent="Checking…";
        try{ const r=await fetch(GH_API+"/contents/data/seq.json?t="+Date.now(),{headers:{Authorization:"Bearer "+v,Accept:"application/vnd.github+json"}}); if(!r.ok) throw new Error("GitHub refused it ("+r.status+") — check the token's repository and Contents permission.");
          const sc=r.headers.get("x-oauth-scopes"); if(sc&&/\brepo\b/.test(sc)&&!confirm("This is a classic token with the full 'repo' scope (every repository of the account). A fine-grained token limited to this repository is safer. Use it anyway?")) throw new Error("cancelled");
          const old=PAT; ADMIN.pat=v; PAT=v;
          try{ await saveAdmin("Admin: token replaced"); }catch(e){ ADMIN.pat=old; PAT=old; throw e; }
          toast("Token replaced and saved. Now revoke the old token on GitHub (Settings → Developer settings → tokens).",12000); render(); return; }
        catch(e){ if(e.message!=="cancelled") toast("Not replaced: "+e.message,9000); }
        tk.disabled=false; tk.textContent="Replace GitHub token…"; };
      acts.appendChild(tk); const kind=PAT?(/^github_pat_/.test(PAT)?"fine-grained token":"classic token"):"no token"; acts.appendChild(el("span","meta","Site saves use a "+kind+" ("+(PAT?PAT.slice(0,4)+"…"+PAT.slice(-3):"—")+").")); }
    zone.appendChild(acts);
    zone.appendChild(el("p","meta","<b>Reset password</b> saves the new password immediately (no need to click Save changes). Passwords are never stored — the site derives a key from them. Keep them 10+ characters. Consolidated needs both companies ticked. Ahmed’s own admin access can’t be removed. Rights are applied by the site; anyone holding at least one right also holds the site’s save token — with it they could post straight to the books or change any file in the site repository, so give rights only to people you trust with the books, and replace the token when someone with a right leaves."));
  }).catch(e=>{ zone.innerHTML=""; zone.appendChild(el("p","meta","Couldn’t open the people register: "+esc(e.message))); });
}

/* ---------- guide ---------- */
function viewGuide(m){
  const g=el("div","guide");
  g.innerHTML='<h3>What this is</h3><p>The live books of <strong>Wahj</strong> — Vyltic and Welltold — with the same sheets as the Excel: P&amp;L, Balance Sheet, Cash Flow, GL, Trial Balance, Lists and CoA. What you can see is set per person by an admin (Vyltic, Welltold, or both plus the consolidated view).</p>'
  +'<h3>Signing in</h3><p>Email and password, like any site. An admin adds you and gives you your first password. Forgot it? An admin resets it in seconds.</p>'
  +'<h3>Rights</h3><p>Everyone sees the reports of their companies. An admin gives each person the rights they need: <strong>CoA</strong> (add accounts), <strong>Lists</strong> (add names), <strong>Entries</strong> (draft entries that wait in <em>Pending</em>) and <strong>Posting</strong> (post entries straight into the books, post or reject what is waiting in Pending, and run the month-end tabs). No rights = view only. <strong>Admin</strong> holds every right and manages people.</p>'
  +'<h3>Posting an entry</h3><p>Entry tab → New entry → pick the company and date, add the lines, make sure it says <em>balanced</em>, then <strong>Post entry</strong> (Posting right) or <strong>Send for posting</strong> (Entries right — it waits in the Pending tab until someone with Posting posts or rejects it). A posted entry gets the next number and shows in the GL and every report at once. Cross-company entries and corrections still go through Ahmed — there is no delete; a mistake is fixed with a reversing entry.</p>'
  +'<h3>Month-end (Employees &amp; Closing tabs)</h3><p>People with the Posting right and both companies see two more tabs. <strong>Employees</strong> is the payroll register: company, cost center, monthly salary, current/stopped — change someone&rsquo;s company there and the next month books to the new company. <strong>Closing</strong> runs the month: salaries (expense to 5100, advances cleared from 1100, the rest owed on 2000; tick <em>Paid</em> per person when you pay and it posts Dr 2000 / Cr 1000), depreciation (straight-line from the asset register, with catch-up for months never booked) and the Welltold profit share (⅓ each of the month’s net — a loss is shared too, netting against what is owed; re-run it whenever the month changes and it rewrites the same entry). Everything it books is a normal entry you can see in the GL.</p>'
  +'<h3>Clients — projects &amp; retainers</h3><p>The <strong>Clients</strong> tab (per company; Consolidated shows Welltold) keeps the agency&rsquo;s revenue register. <em>Retainers</em>: client, monthly fee, revenue account, from/to months, and whether the invoice carries 16% sales tax. <strong>Run retainers for the month</strong> invoices every retainer due and not yet in the books — one entry dated the 1st of the month, Dr Accounts Receivable per client / Cr revenue (tax to 2200 Taxes Payable) — and can be re-run; an invoice already posted by hand for that client and month is recognised and skipped. Run it before the Welltold profit share. <em>Projects</em>: one-off fees with a date; <em>Book</em> posts the invoice, or type an entry number to link one already in the books. <em>Client balances</em> shows billed / invoiced / collected / outstanding per client from the books, with <em>Collect&hellip;</em> to book money received (Dr Cash / Cr Accounts Receivable). The last table is revenue by client and month.</p>'
+'<h3>Software &amp; subscriptions</h3><p>Closing tab, section 2: a register of every recurring charge (vendor, company, account, amount in JOD or USD, monthly or annual with its renewal month, from/to). <strong>Run subscriptions for the month</strong> books what is due and not yet in the books — one entry per company, Dr the expense account per vendor / Cr cash — and can be re-run; charges already posted by hand for that vendor and month are recognised and not booked twice.</p>'+'<h3>Fixed assets</h3><p>The <strong>Assets</strong> tab lists every purchase booked to 1500 with its ready-for-use date, useful life, salvage, depreciation booked and net book value. <em>Sell…</em> or <em>Retire</em> posts the disposal entry immediately (proceeds to cash, accumulated depreciation and cost removed, gain to 4100 or loss to 5900). Old sales booked straight to 1500 can be linked to their asset and the leftover cost written off.</p>'
  +'<h3>Reading the numbers</h3><p>Cash is one pooled bank balance for the whole entity — a company&rsquo;s share can be negative (the other side funds it). Lines marked <code>IC Intercompany</code> only balance cross-company entries inside a single-company view. The Welltold profit share (⅓ Joud + ⅓ Rami of the monthly net) is booked centrally at month-end.</p>'
  +'<h3>Briefing for your AI</h3>';
  const cp=el("button","btn2","Copy AI briefing"); cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(RULES).then(()=>toast("Copied."));};
  g.appendChild(cp);
  const pre=el("pre","brief"); pre.textContent=RULES; g.appendChild(pre);
  const out=el("button","btn3","Sign out of this device"); out.style.marginTop="16px"; out.onclick=signOut;
  g.appendChild(out);
  m.appendChild(g);
}

const totop=document.getElementById("totop");
function upd(){ const w=document.querySelector(".xlwrap"); const s=window.scrollY>500||(w&&w.scrollTop>400); totop.classList.toggle("show",!!s); }
window.addEventListener("scroll",upd,{passive:true});
document.addEventListener("scroll",e=>{ if(e.target&&e.target.classList&&e.target.classList.contains("xlwrap")) upd(); },true);
totop.onclick=()=>{ document.querySelectorAll(".xlwrap").forEach(w=>w.scrollTo({top:0,behavior:"smooth"})); window.scrollTo({top:0,behavior:"smooth"}); };
boot();
</script>
